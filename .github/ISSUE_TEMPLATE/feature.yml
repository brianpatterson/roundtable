name: Feature
description: Something the app should do. Label it `ready` to have the factory build it.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        A good ticket is the biggest lever on what the factory builds (ADR-0025). Write it for
        someone who knows the code but not what's in your head. Never paste user data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's wrong or missing today, and who it affects.
    validations:
      required: true
  - type: input
    id: story
    attributes:
      label: User story
      placeholder: As a job seeker, I want … so that …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One Given/When/Then per behavior. Each becomes at least one test.
      placeholder: |
        - Given …, when …, then …
        - Given …, when …, then …
    validations:
      required: true
  - type: checkboxes
    id: modules
    attributes:
      label: Modules touched
      description: Where the change belongs (ADR-0023). Pick every one you expect.
      options:
        - label: 'API: applications'
        - label: 'API: identity'
        - label: 'API: email'
        - label: 'API: platform (config, database, observability)'
        - label: 'Contract (packages/contract)'
        - label: 'Web: applications'
        - label: 'Web: identity'
        - label: 'Web: shell'
        - label: 'Web: design system'
        - label: 'Infra (infra/, deploy)'
        - label: 'Docs only'
  - type: textarea
    id: design-system
    attributes:
      label: Design system components
      description: >-
        Existing components to use, or new ones the change needs (ADR-0024). "None" is fine. A
        component built for a later ticket's use: its acceptance criteria spell out exactly what
        that ticket will pass it (docs/agents/issue-tracker.md, "Writing a ticket").
  - type: textarea
    id: shared-rules
    attributes:
      label: Shared rules
      description: >-
        A rule this ticket defines that other tickets will reuse (an order, a display name, a day
        boundary), and the one place it should live, e.g. "Round order: one function in
        packages/contract". For a ticket that changes such a rule, what already depends on it.
        "None" is fine.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this ticket deliberately doesn't do.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Docs impact
      description: An ADR? architecture.md (components, data model, API, environments)? The roadmap? "None" is fine.
    validations:
      required: true
