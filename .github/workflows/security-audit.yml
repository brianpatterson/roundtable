# The factory's security auditor (ADR-0036): once a week an agent with its own instructions and no
# stake in the code looks for security holes the scanners and the per-PR reviewer miss. It follows
# data out of the process, checks auth and tenancy, probes inputs and config, and injects faults
# (database down, mailer throwing) by writing throwaway tests in apps/api/test/audit/ and running
# them, the way the 2026-11-10 leak was found (#29).
#
# The repository is public, so nothing about a finding is published here. Each confirmed finding
# becomes a draft security advisory, private to the owner, filed by a deterministic step with a
# token only that step sees. Findings never pass through a step's `env:` or the agent's prompt,
# which GitHub prints in the public log: the agent writes them to a file, and the filing step reads
# it. The job summary says only that the run finished.
name: Security audit

on:
  schedule:
    - cron: '41 6 * * 3' # Wednesdays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: factory
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      FINDINGS: apps/api/test/audit/findings.json
    steps:
      - name: Check the advisory token
        env:
          ADVISORY_TOKEN: ${{ secrets.SECURITY_ADVISORY_TOKEN }}
        run: |
          [ -n "$ADVISORY_TOKEN" ] || {
            echo "::error::SECURITY_ADVISORY_TOKEN isn't set in the factory environment. Create a fine-grained token for this repository with 'Repository security advisories: Read and write' only, and add it there (ADR-0036)."
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load the instructions, the secret guard and the denial report from main
        run: cp .github/factory/auditor.md .github/factory/guard-secrets.sh .github/factory/report-denials.sh "$RUNNER_TEMP/"

      # What has already been filed, so the agent doesn't report it again. A file, not the prompt:
      # action inputs appear in the public log, and advisory titles describe the hole.
      - name: List the advisories already filed
        env:
          GH_TOKEN: ${{ secrets.SECURITY_ADVISORY_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/security-advisories?per_page=100" --paginate \
            --jq '.[] | "- [\(.state)] \(.summary)"' > "$RUNNER_TEMP/known-advisories.md"
          echo "Listed the advisories already filed."

      - uses: ./.github/actions/isolate-agent
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache (ADR-0030), like the other agent jobs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p apps/api/test/audit

      - name: Audit
        id: claude
        uses: anthropics/claude-code-action@d1f58ad5e6f4d2b79547e63e37c2116064135896 # v1.0.277
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1' # ADR-0029; also forces explicit tool rules
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # It only reads the repository, so the job's own read-only token is enough.
          github_token: ${{ github.token }}
          prompt: |
            Run this week's security audit of ${{ github.repository }}, following your instructions.
            The advisories already filed are listed in ${{ runner.temp }}/known-advisories.md.
            Write your findings to ${{ env.FINDINGS }}.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 150
            --permission-mode default
            --append-system-prompt-file ${{ runner.temp }}/auditor.md
            --allowedTools "Read,Glob,Grep,Task,Agent,Edit(./apps/api/test/audit/**),Write(./apps/api/test/audit/**),MultiEdit(./apps/api/test/audit/**),Bash(cd:*),Bash(ls:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(pnpm --filter @roundtable/api test:*),Bash(pnpm --filter @roundtable/web test:*),Bash(pnpm vitest:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(pnpm exec:*),Bash(pnpm dlx:*),Bash(pnpx:*),Bash(npx:*),Bash(git config:*),Bash(git remote:*),Bash(git -c:*),Bash(git --config-env:*),Bash(git --config-env=*),Bash(git credential:*),Read(./.git/**),Grep(./.git/**),Glob(./.git/**)"

      - name: Explain a failed run
        if: always() && steps.claude.outcome == 'failure'
        run: |
          file="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$file" ] || { echo "::error::The audit failed before writing its output."; exit 0; }
          # The error message only: never the agent's own text, which could describe a finding.
          reason=$(jq -r '[.[] | select(.type == "result")] | last | (.errors // [] | join(", ")) // "no result message"' "$file" | head -c 500)
          echo "::error::The audit failed: ${reason:-see the run}"

      - name: Report denied tool calls
        id: denials
        if: always()
        run: '"$RUNNER_TEMP/report-denials.sh"'

      # A suspicious run files nothing (ADR-0029).
      - name: Stop a suspicious run
        if: always() && steps.denials.outputs.suspicious == 'true'
        run: |
          echo "::error::The auditor tried tool calls that reach for credentials or the factory's rules. Nothing was filed; read the run."
          exit 1

      - name: File each new finding as a draft security advisory
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_ADVISORY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f "$FINDINGS" ] || { echo "::error::The auditor wrote no findings file."; exit 1; }
          jq -e '.findings | type == "array"' "$FINDINGS" >/dev/null ||
            { echo "::error::The findings file isn't in the expected shape."; exit 1; }

          known=$(gh api "repos/$GITHUB_REPOSITORY/security-advisories?per_page=100" --paginate \
            --jq '.[].summary | ascii_downcase')

          count=$(jq '.findings | length' "$FINDINGS")
          for i in $(seq 0 $((count - 1))); do
            finding=$(jq -c ".findings[$i]" "$FINDINGS")
            summary=$(jq -r '.title' <<<"$finding" | head -c 200)
            if grep -qxF "$(tr '[:upper:]' '[:lower:]' <<<"$summary")" <<<"$known"; then continue; fi

            body=$(jq -n --argjson f "$finding" --arg run "$RUN_URL" '{
              summary: ($f.title[0:200]),
              severity: (if ($f.severity | IN("low","medium","high","critical")) then $f.severity else "medium" end),
              description: (
                "**Category:** \($f.category)\n\n" +
                "**Where:** " + ($f.files | map("`\(.)`") | join(", ")) + "\n\n" +
                "### What happens\n\n\($f.details)\n\n" +
                "### Reproduction\n\n\($f.reproduction)\n\n" +
                "### Suggested fix\n\n\($f.fix)\n\n" +
                "<sub>Filed by the security auditor ([run](\($run)), ADR-0036). Unverified by a human: triage it, then fix it in the advisory'"'"'s private fork or close it.</sub>"
              ),
              vulnerabilities: [{ package: { ecosystem: "other", name: "roundtable" } }]
            }')

            # Private, but it may be published one day: no credentials in it, ever.
            "$RUNNER_TEMP/guard-secrets.sh" <<<"$body" || continue
            gh api -X POST "repos/$GITHUB_REPOSITORY/security-advisories" --input - <<<"$body" >/dev/null

          done

          # Public: no count, no titles. The owner reads Security → Advisories.
          echo "The audit finished. New findings, if any, are draft advisories under Security → Advisories." >> "$GITHUB_STEP_SUMMARY"
          echo "Audit finished."
