name: Deploy

# Every green CI run on main that changes something that ships goes to production (docs-only
# merges are skipped; see the `changes` job). Manual runs (Actions → Deploy → Run workflow)
# redeploy the current main, e.g. after replacing the droplet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # The commit CI tested (workflow_run), or the current main (manual run).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/roundtable

jobs:
  # Every deploy restarts the API and Caddy (about 10 seconds down), so don't deploy when nothing
  # that ships has changed since what production runs, e.g. a docs-only merge.
  changes:
    # `branches: [main]` above matches the branch *name*, which a fork's PR can also use. Only
    # deploy CI runs from a push to this repository's main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # find the last successful deploy run
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # A manual run always deploys (e.g. after replacing the droplet).
          if [ "$EVENT" = workflow_dispatch ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # What production runs: the commit of the last successful deploy run. A failed deploy
          # rolls back and exits 1, so it never counts; a skipped one only changed non-shipping
          # files, so production is equivalent to it.
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable previous deploy ($base): deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "$SHA")
          echo "Changed since $base:"; echo "${changed:-(nothing)}"
          # Files that never reach the server: docs, Markdown, agent config, and OpenTofu (applied
          # by a human, not by this workflow). Anything else, including workflows, deploys.
          shipping=$(printf '%s\n' "$changed" | grep -vE '^(docs/|\.claude/|infra/)|\.md$' | grep -v '^$' || true)
          if [ -n "$shipping" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing that ships changed since $base; skipping the deploy."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # Immutable SHA tag for deploys and rollbacks; `latest` only for humans browsing.
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ env.SHA }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets live in this protected environment, and GitHub records every deployment to it.
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read # the server pulls images with this run's token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host key from OpenTofu: no trust-on-first-use, and a server that isn't ours is refused.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' \
            "$DEPLOY_HOST" > ~/.ssh/config

      - name: Copy compose file and deploy scripts
        run: scp compose.prod.yml deploy/deploy.sh deploy/post-migrate.sh prod:/opt/interview-app/

      - name: Deploy (health-checked, rolls back on failure)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # Log in to the registry with this run's short-lived token, in a throwaway Docker config,
          # so no registry credential is ever stored on the server. $ACTOR, $IMAGE_PREFIX and $SHA
          # expand here, on the runner, on purpose.
          # shellcheck disable=SC2029
          printf '%s' "$TOKEN" | ssh prod "
            set -e
            export DOCKER_CONFIG=\$(mktemp -d); trap 'rm -rf \$DOCKER_CONFIG' EXIT
            docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null
            /opt/interview-app/deploy.sh '$IMAGE_PREFIX-api:$SHA' '$IMAGE_PREFIX-web:$SHA'
          "

      - name: Smoke test from outside
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "https://$DOMAIN/api/health" | tee /dev/stderr | grep -q '"db":"up"'
          curl -fsS -o /dev/null -w 'index.html: %{http_code}\n' "https://$DOMAIN/"

      # Post-deploy migrations (ADR-0073): the ones whose folder ends in `_postdeploy` remove
      # schema, so they run only now, once the new release has passed the health check and the
      # smoke test. A rollback happens before this point, so the previous release never meets a
      # dropped column. If `post` fails, the release stays up, this run goes red, and the next
      # deploy's `post` retries it.
      #
      # The snapshot makes a bad drop a restore rather than a loss. It's encrypted here, to the
      # backups' age recipient (a public key, so a repository variable), as backup.yml does: the
      # plaintext dump only exists in the pipe, and the server never holds a key that can read it.
      # Same pinned age as backup.yml; upgrade both together.
      - name: Install age
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          tarball="age-$AGE_VERSION-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/$tarball"
          echo "$AGE_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/age/age" /usr/local/bin/
          age --version

      - name: Snapshot the database before post-deploy migrations
        env:
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -o pipefail
          if [ -z "$RECIPIENT" ]; then
            echo "::error::Set the repository variable BACKUP_AGE_RECIPIENT (age-keygen -y on the backups' key; infra/README.md)."
            exit 1
          fi
          name="pre-post-$(date -u +%Y-%m-%dT%H%M%SZ)-${SHA:0:12}.dump.age"
          echo "SNAPSHOT=/opt/interview-app/snapshots/$name" >> "$GITHUB_ENV"
          # $name expands here, on the runner, on purpose (twice below).
          # shellcheck disable=SC2029
          ssh prod 'docker exec interview-app-prod-db-1 pg_dump -U app -d app --format=custom' \
            | age --recipient "$RECIPIENT" \
            | ssh prod "umask 077 && mkdir -p /opt/interview-app/snapshots && cat > /opt/interview-app/snapshots/$name"
          # shellcheck disable=SC2029
          ssh prod "ls -l /opt/interview-app/snapshots/$name"

      - name: Post-deploy migrations
        run: |
          # $SNAPSHOT expands here, on the runner, on purpose.
          # shellcheck disable=SC2029
          ssh prod "/opt/interview-app/post-migrate.sh '$SNAPSHOT'"
