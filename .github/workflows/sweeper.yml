# The factory's sweeper (ADR-0040): every 20 minutes, each open factory pull request (labeled
# `factory` or `autofix`, drafts included, not already `needs-human`) is checked for being stuck in a
# state no workflow reacts to: CI cancelled or timed out, CI never started or never finished, a
# conflict with main, a green commit the reviewer never reviewed, a failure the CI fixer never
# fixed, changes asked for and never reworked. A cancelled CI is rerun once; a factory pull
# request's conflict starts the conflict resolver (ADR-0058); everything else gets `needs-human`
# and a comment saying why. The rules live in .github/factory/sweep-prs.sh, pinned
# by test-sweep-prs.sh in CI. No agent runs here.
#
# What starts it (ADR-0060): GitHub starts this repository's scheduled runs hours late and drops
# the rest, so the factory's clock (a Cloudflare Worker, infra/factory-clock.tf) dispatches it
# every 20 minutes. It also runs after every CI and Review run, which is when most stuck states
# begin, and on GitHub's own cron as a backstop. Every successful sweep pings a Better Stack
# heartbeat, which alerts when an hour passes without one.
name: Factory sweeper

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what it would do and change nothing
        type: boolean
        default: false
  workflow_run:
    workflows: [CI, Review]
    types: [completed]
  # A backstop for the clock. GitHub runs it every few hours at best (ADR-0060).
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

# Extra triggers queue rather than race: one sweep at a time, and at most one waiting (a newer
# one replaces it), which is all that's needed, since each sweep reads the current state.
concurrency:
  group: factory-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # rerun a cancelled CI, start the conflict resolver
      pull-requests: write # label and comment
      issues: write # labels and comments go through the issues API
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/factory
      - env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: .github/factory/sweep-prs.sh
      # The dead man's switch (ADR-0060). A sweep that fails or never runs sends nothing, and
      # Better Stack alerts when an hour passes without a ping. Skipped until the secret is set.
      - name: Report to the heartbeat monitor
        if: inputs.dry_run != true
        env:
          HEARTBEAT_URL: ${{ secrets.SWEEPER_HEARTBEAT_URL }}
        run: .github/factory/ping-heartbeat.sh
