# Main no longer has to be up to date before a pull request merges (ADR-0035), so two pull
# requests that pass on their own can break main together. CI on main catches it, and Deploy then
# skips, but nothing told anyone: the CI fixer only works on pull requests. This opens one issue
# while CI or Deploy is failing on main, comments on it for each further failure, and closes it
# when that workflow passes again. No agent runs here.
#
# The repository is public; the issue links the run and names the commit, as the Actions tab
# already does, and carries nothing else from the logs.
name: Main health

on:
  workflow_run:
    workflows: [CI, Deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  track:
    # Pushes to this repository's main; a fork's pull request from a branch named main doesn't count.
    if: >-
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="$WORKFLOW is failing on main"
          gh label create main-broken -R "$GITHUB_REPOSITORY" --color B60205 \
            --description "CI or Deploy is failing on main" 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label main-broken \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')

          if [ "$CONCLUSION" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" -R "$GITHUB_REPOSITORY" \
                --comment "$WORKFLOW passed again on main at ${SHA:0:7}: $RUN_URL"
            fi
            exit 0
          fi

          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" \
              --body "Still failing at ${SHA:0:7} ($CONCLUSION): $RUN_URL"
            exit 0
          fi

          body="$WORKFLOW failed on main at ${SHA:0:7} ($CONCLUSION): $RUN_URL

          Main doesn't have to be up to date before a pull request merges (ADR-0035), so the likely cause is two pull requests that passed on their own and break together. While CI fails, Deploy skips, so production stays on the last good release.

          Fix it in a pull request. This issue closes when $WORKFLOW passes on main again."
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label main-broken --body "$body"
