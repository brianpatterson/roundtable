# The software factory's implementer (ADR-0025): a `ready` label on an issue, or an `@claude`
# comment from the repository owner on an issue or pull request, runs Claude Code on a branch.
# It builds the ticket to `pnpm check`'s bar and opens a pull request; a human always merges.
#
# Only `issues` and `issue_comment` trigger it (pull request conversation comments are
# `issue_comment` events). Both always run this file and the agent's instructions from `main`,
# never from a branch, and the `factory` environment, which holds the Claude token, only admits
# `main`. A branch can't change what the agent is told or reach the token.
name: Factory

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

# One run per ticket or pull request at a time; a second request waits rather than racing.
concurrency:
  group: factory-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # Only the owner starts it: by labeling, or by mentioning @claude. Strangers can open issues
    # on a public repo, so the label is the owner's sign-off that the ticket is safe to build.
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && github.event.label.name == 'ready') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: factory
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # lets the agent read CI results on its pull requests
      id-token: write # exchanged for the Claude GitHub App's short-lived token
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      # Copied out of the workspace before the agent switches branches, so the instructions it
      # runs under are main's, whatever a branch contains.
      - name: Load the implementer's instructions from main
        run: cp .github/factory/implementer.md "$RUNNER_TEMP/implementer.md"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Implement
        id: claude
        uses: anthropics/claude-code-action@d1f58ad5e6f4d2b79547e63e37c2116064135896 # v1.0.277
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: ready
          trigger_phrase: '@claude'
          # Only the owner's comments reach the agent; anyone else's text in the thread is dropped.
          include_comments_by_actor: ${{ github.repository_owner }}
          # The job's 60-minute timeout is the real limit. 60 turns was too few: #53, a feature with a
          # new component and its tests, took 70 and was marked failed after it had opened its PR.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 150
            --permission-mode acceptEdits
            --append-system-prompt-file ${{ runner.temp }}/implementer.md
            --allowedTools "Bash(pnpm:*),Bash(git:*),Bash(ls:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
            --disallowedTools "WebFetch,WebSearch"

      # The action hides Claude's messages from the public log, including the one that says why
      # a run failed (a rejected token, an unknown model). Show only that final message.
      - name: Explain a failed run
        if: always() && steps.claude.outcome == 'failure'
        run: |
          file="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$file" ] || { echo "::error::The agent failed before writing its output."; exit 0; }
          reason=$(jq -r '[.[] | select(.type == "result")] | last | (.result // (.errors // [] | join(", "))) // "no result message"' "$file" | head -c 1000)
          echo "::error::The agent failed: $reason"
          printf '### The agent failed\n\n~~~\n%s\n~~~\n' "$reason" >> "$GITHUB_STEP_SUMMARY"

      # Deterministic checks on what the agent left, whatever it reported.
      - name: Check the result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          needs_info() {
            gh issue edit "$ISSUE" --remove-label ready --add-label needs-info
            exit 0
          }

          # Asked through the API, not git: the action rewires the checkout's credentials.
          # No branch, or nothing committed: the agent stopped to ask, or failed. Its comment says which.
          [ -n "$BRANCH" ] || needs_info
          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" 2>/dev/null) || needs_info
          [ "$(echo "$compare" | jq .ahead_by)" -gt 0 ] || needs_info

          # The agent never changes its own rules or CI.
          if echo "$compare" | jq -r '.files[].filename' | grep -qE '^(\.github/|\.claude/|CLAUDE\.md$)'; then
            gh issue comment "$ISSUE" --body "The factory's branch \`$BRANCH\` changes \`.github/\`, \`.claude/\` or \`CLAUDE.md\`, which the implementer may not touch. Don't merge it."
            echo "::error::$BRANCH changes protected paths"
            exit 1
          fi

          # The agent opens the pull request with the Claude App's token, so CI runs on it. If it
          # didn't, open one here; a PR opened with this job's token starts no workflows, so CI
          # waits until a human closes and reopens it.
          if [ "$(gh pr list --head "$BRANCH" --state all --json number --jq length)" = 0 ]; then
            body=$(printf 'Closes #%s\n\nThe implementer pushed this branch but did not open the pull request. **CI has not run: close and reopen this PR to start it.**' "$ISSUE")
            gh pr create --base main --head "$BRANCH" --title "$(gh issue view "$ISSUE" --json title --jq .title)" --body "$body" --label factory --draft
          fi
