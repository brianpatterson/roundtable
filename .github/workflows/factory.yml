# The software factory's implementer (ADR-0025): a `ready` label on an issue, or an `@claude`
# comment from the repository owner on a pull request (ADR-0048), runs Claude Code on a branch.
# It builds the ticket to `pnpm check`'s bar and opens a pull request; a human always merges.
#
# When CI, dependency review or CodeQL fails on a factory pull request (or one labeled `autofix`),
# the same agent fixes it: up to two attempts, then it stops and asks for a human (ADR-0028).
#
# A `ready` ticket is started by the dispatcher (ADR-0047) through `workflow_dispatch`: by the
# `gate` job when the owner labels it, or by a sweep once its blockers are deployed. `verify` checks
# the dispatcher's rules again with no secrets, then `build` runs the agent on the ticket, after
# checking once more that nobody else edited it. An `@claude` comment on a pull request runs
# `implement` directly.
#
# Only `issues`, `issue_comment` (pull request conversation comments included), `workflow_run` and
# `workflow_dispatch` trigger it. The first three always run this file and the agent's instructions
# from `main`, never from a branch; a dispatch can name a branch, but the `factory` environment,
# which holds the Claude token, only admits `main`. A branch can't change what the agent is told or
# reach the token.
name: Factory

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI, Dependency review, CodeQL]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue:
        description: The ready ticket to build (the dispatcher starts these; ADR-0047)
        type: number
        required: true

permissions:
  contents: read

# One run per ticket or pull request at a time; a second request waits rather than racing.
# A failed check's run takes its branch's group only in fix-ci, below: most of those runs end in
# select-fix, and holding the group for them would let one replace a pending fix or rework, since
# GitHub keeps one pending run per group (ADR-0037).
concurrency:
  # A dispatched build gets its own group: GitHub keeps one pending run per group, so in the
  # issue's group, anyone's comment on the ticket could replace it while it waited. Nothing else
  # builds on a ticket's issue: `@claude` only runs on pull requests (ADR-0048).
  group: factory-${{ github.event_name == 'workflow_dispatch' && format('dispatched-{0}', inputs.issue) || github.event.issue.number || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Whether the ticket the owner just labeled `ready` may be built now (ADR-0047): not while an
  # issue blocking it is unmerged or undeployed, not if someone else edited it after the label, and
  # one ticket at a time. Holds no secrets and runs no agent. Shares its group with the Dispatcher
  # workflow, so two decisions never read the same in-flight state. GitHub keeps one pending run per
  # group and cancels the others, silently skipping that label's build. The dispatcher's next sweep
  # (within 20 minutes, ADR-0060) decides every `ready` ticket again, and starts it then.
  #
  # A ticket it lets through is started the way the sweep starts one, through workflow_dispatch:
  # `build` re-checks the ticket after loading it, so an edit made after this decision never
  # reaches the agent. The tag-mode `implement` job reads the issue itself, too late to check.
  gate:
    if: >-
      github.actor == github.repository_owner &&
      github.event_name == 'issues' && github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: factory-dispatch
      cancel-in-progress: false
    permissions:
      contents: read # compares commits with what's deployed
      issues: write # labels and comments
      actions: write # finds the latest successful Deploy, and starts the build (workflow_dispatch)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/factory
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: .github/factory/dispatch.sh --gate "$ISSUE"

  implement:
    # The owner mentioning @claude on a pull request: a follow-up on work that exists ("resolve the
    # conflict", "address the review"), outside the dispatcher's queue. Strangers can comment on a
    # public repo, so only the owner's mention counts. Not on issues: a ticket is built by labeling
    # it `ready`, through the gate and `build`, so nothing races a ticket's build (ADR-0048).
    if: >-
      github.actor == github.repository_owner &&
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: factory
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # lets the agent read CI results on its pull requests
      id-token: write # exchanged for the Claude GitHub App's short-lived token
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      # Keeps no credentials (as fix-ci, ADR-0028): a follow-up push made with this job's token
      # gets its CI held for manual approval (#75, #76). The Claude App's token, which the action
      # sets on the remote, is the only one left.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Copied out of the workspace before the agent switches branches, so the instructions it
      # runs under are main's, whatever a branch contains.
      - name: Load the implementer's instructions and the guards from main
        run: |
          cp .github/factory/implementer.md .github/factory/install-browsers.sh .github/factory/guard-secrets.sh .github/factory/report-denials.sh .github/factory/agent-trail.sh \
            .github/factory/explain-failure.sh .github/factory/flag-suspicious.sh \
            .github/factory/takedown-credentials.sh "$RUNNER_TEMP/"
      - uses: ./.github/actions/isolate-agent
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache here (ADR-0030): this job's caches are saved under main, and what it
      # installs comes from a branch, so a cache it saved could reach CI and deploy on main.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Chromium for the browser tests the agent writes and runs (ADR-0066), by main's script:
      # it runs with sudo, and no code from the branch does.
      - name: Install Chromium for the browser tests
        run: '"$RUNNER_TEMP/install-browsers.sh"'

      # Whether this is a follow-up on one of the factory's own pull requests (ADR-0034): opened by
      # claude[bot] from a claude/ branch in this repository. The author alone isn't enough: every
      # installation of the Claude App is claude[bot]. Anything else, or any doubt, keeps the
      # action's restriction on running a pull request's code.
      - name: Is this the factory's own pull request?
        id: own_pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" \
            --jq '[.user.login, .head.repo.full_name // "", .head.ref] | @tsv') || pr=""
          IFS=$'\t' read -r author head_repo head_ref <<<"$pr"
          if [ "$author" = "claude[bot]" ] && [ "$head_repo" = "$GITHUB_REPOSITORY" ] && [[ "$head_ref" == claude/* ]]; then
            echo "own=true" >> "$GITHUB_OUTPUT"
          else
            echo "own=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Implement
        id: claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        env:
          # Commands the agent runs get no Anthropic credentials and no OIDC or runtime tokens
          # (ADR-0029); `gh` keeps its token. Requires ./.github/actions/isolate-agent. It also
          # forces Claude Code's `default` permission mode, ignoring `acceptEdits`: every tool,
          # file edits included, must be in --allowedTools. Its sandbox keeps the root
          # package.json, pnpm-lock.yaml and node_modules/.bin read-only, so the agent can't add,
          # remove or upgrade a package, and no agent job allows pnpm add, remove or install (ADR-0050).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          # Only the owner's comments, and the reviewer's (posted by github-actions[bot], ADR-0026),
          # reach the agent; anyone else's text in the thread is dropped.
          include_comments_by_actor: ${{ github.repository_owner }},github-actions[bot]
          # On a pull request whose author isn't confirmed to have write access, the action refuses
          # every command that runs the checkout's code (`pnpm check`, the tests). The factory's own
          # pull requests are opened by claude[bot], so follow-ups (`@claude address the review`)
          # pushed fixes nobody had run (#76). Lifted only on those, as checked above; any other
          # pull request keeps it, even when the owner mentions @claude (ADR-0034).
          restrict_untrusted_prs: ${{ steps.own_pr.outputs.own == 'true' && 'false' || 'true' }}
          # The job's 60-minute timeout is the real limit. 60 turns was too few: #53, a feature with a
          # new component and its tests, took 70 and was marked failed after it had opened its PR.
          # 150 was too: #132, an API, contract and web change with an ADR, took 179 in 25 minutes.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 250
            --permission-mode acceptEdits
            --append-system-prompt-file ${{ runner.temp }}/implementer.md
            --allowedTools "Edit,Write,MultiEdit,Bash(cd:*),Bash(pnpm check),Bash(pnpm check:effect),Bash(pnpm check:deps),Bash(pnpm check:adrs),Bash(pnpm check:format),Bash(pnpm check:boundaries),Bash(pnpm prettier:*),Bash(pnpm audit:*),Bash(pnpm format:*),Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm typecheck),Bash(pnpm test:*),Bash(pnpm --filter @roundtable/web test:*),Bash(pnpm --filter @roundtable/api test:*),Bash(pnpm vitest:*),Bash(pnpm db:generate:*),Bash(pnpm --filter @roundtable/web test:browser:*),Bash(pnpm --filter @roundtable/web test:mutation:*),Bash(pnpm --filter @roundtable/api test:mutation:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git commit:*),Bash(git push),Bash(git push origin:*),Bash(git fetch:*),Bash(git merge:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(ls:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(pnpm exec:*),Bash(pnpm dlx:*),Bash(pnpx:*),Bash(npx:*),Bash(git config:*),Bash(git remote:*),Bash(git -c:*),Bash(git --config-env:*),Bash(git --config-env=*),Bash(git credential:*),Read(./.git/**),Grep(./.git/**),Glob(./.git/**),Edit(./.git/**),Write(./.git/**),Edit(./.github/**),Write(./.github/**),Edit(./.claude/**),Write(./.claude/**),Edit(./CLAUDE.md),Write(./CLAUDE.md)"

      # The guards after every agent run live in .github/factory/ and were copied from main above:
      # the workspace may be on the pull request's branch by now, and a branch must not change them.
      - name: Explain a failed run
        id: failure
        if: always() && steps.claude.outcome == 'failure'
        run: '"$RUNNER_TEMP/explain-failure.sh" agent'

      # Lists what the agent was refused, and flags the run for a human if it reached for
      # credentials or the factory's own rules (ADR-0029).
      - name: Report denied tool calls
        id: denials
        if: always()
        run: '"$RUNNER_TEMP/report-denials.sh"'
      # What the agent did, for the batch retrospective (ADR-0064): a shaped trail, never its text.
      - name: Keep the agent's trail
        if: always()
        run: '"$RUNNER_TEMP/agent-trail.sh" implement'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-trail-pr-${{ github.event.issue.number }}-implement-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-trail/trail.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Flag a suspicious run
        if: always() && steps.denials.outputs.suspicious == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: '"$RUNNER_TEMP/flag-suspicious.sh"'

      # The pull request this ran on, and any the agent opened from its branch (ADR-0029).
      - name: Take down anything that looks like a credential
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          PRS="$NUMBER $( { [ -n "$BRANCH" ] && gh pr list --head "$BRANCH" --state all --json number --jq '.[].number'; } || true)" \
            "$RUNNER_TEMP/takedown-credentials.sh"

  # A ticket the dispatcher started (ADR-0047), from a sweep or from the gate when the owner labeled it. Its rules are checked again here, in a job with no
  # secrets, before anything runs: whoever dispatched this, only a ticket the owner labeled `ready`,
  # unedited since by anyone else, with every blocker deployed, is built. A refused ticket loses
  # `building` and gets a comment saying why.
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # compares commits with what's deployed
      issues: write # releases a refused ticket
      actions: read # finds the latest successful Deploy
    outputs:
      ok: ${{ steps.verify.outputs.ok }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/factory
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: .github/factory/dispatch.sh --verify "$ISSUE"

  # The implementer on a dispatched ticket. The Claude action reads an issue itself only on an issue
  # or comment event, so this runs it in agent mode, like the CI fixer: the ticket reaches the agent
  # as a file, it can't comment, and what it returns is posted by the deterministic steps after it.
  build:
    needs: verify
    if: needs.verify.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: factory
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # lets the agent read CI results on its pull requests
      id-token: write # exchanged for the Claude GitHub App's short-lived token
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      ISSUE: ${{ inputs.issue }}
    steps:
      # As in implement: no credentials kept, and the instructions copied from main first.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load the implementer's instructions and the secret guard from main
        run: |
          cp .github/factory/implementer.md .github/factory/install-browsers.sh .github/factory/guard-secrets.sh .github/factory/report-denials.sh .github/factory/agent-trail.sh \
            .github/factory/fetch-report.sh .github/factory/guard-report-text.sh \
            .github/factory/takedown-report-quotes.sh .github/factory/explain-failure.sh \
            .github/factory/flag-suspicious.sh .github/factory/takedown-credentials.sh \
            .github/factory/protected-changes.sh .github/factory/merge-main.sh "$RUNNER_TEMP/"
          mkdir -p "$RUNNER_TEMP/user-report"
      # The ticket as the label path's agent sees it: the title, the description, and comments from
      # the owner and from github-actions[bot] (the reviewer, the dispatcher); nobody else's.
      - name: Load the ticket
        id: ticket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE")
          mkdir -p .factory
          {
            jq -r '"# #\(.number): \(.title)\n\n\(.body // "")\n"' <<<"$issue"
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
              --jq ".[] | select(.user.login == \"$GITHUB_REPOSITORY_OWNER\" or .user.login == \"github-actions[bot]\") | \"\n---\n\(.user.login) commented:\n\n\(.body)\n\""
          } >.factory/ticket.md
          report=false
          if jq -e '.user.login == "roundtable-user-reports[bot]" and any(.labels[]; .name == "user-report")' <<<"$issue" >/dev/null; then
            report=true
          fi
          {
            echo "report=$report"
            echo "title=$(jq -r .title <<<"$issue" | tr -d '\r\n')"
          } >>"$GITHUB_OUTPUT"

          # verify ran in another job, before this fetch: check again now that the text is fixed in
          # the file, so an edit made in between never reaches the agent. Released, not needs-info.
          # If the ticket can't be read, nothing is known: release it without blaming anyone, and the
          # next sweep starts it again.
          if ! state=$(.github/factory/dispatch.sh --state "$ISSUE"); then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label building
            echo "refused=true" >>"$GITHUB_OUTPUT"
            echo "::error::Couldn't read #$ISSUE to check it for edits; released for the next sweep."
            exit 1
          fi
          # shellcheck disable=SC2016 # backticks are Markdown
          if ! jq -e '.edited_after_ready | not' <<<"$state" >/dev/null; then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label building --remove-label ready
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "$(printf '<!-- factory-dispatch -->\nThe factory stopped before building this: its title or description was edited by someone else after it was approved. Reread it, and label it `ready` again if it should still be built. ADR-0047.')"
            echo "refused=true" >>"$GITHUB_OUTPUT"
            exit 1
          fi
      # A user report's text, as in implement (ADR-0041).
      - name: Fetch the user's report
        id: report
        if: steps.ticket.outputs.report == 'true'
        env:
          TITLE: ${{ steps.ticket.outputs.title }}
          TOKEN: ${{ secrets.FACTORY_REPORTS_TOKEN }}
          REPORTS_URL: https://roundtableapp.us/api/factory/reports
          OUT: ${{ runner.temp }}/user-report
          GUARD: ${{ runner.temp }}/report-guard/description.txt
          PROMPT: ${{ runner.temp }}/implementer.md
        run: '"$RUNNER_TEMP/fetch-report.sh"'
      - uses: ./.github/actions/isolate-agent
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache here (ADR-0030), as in implement.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Chromium for the browser tests the agent writes and runs (ADR-0066), by main's script:
      # it runs with sudo, and no code from the branch does.
      - name: Install Chromium for the browser tests
        run: '"$RUNNER_TEMP/install-browsers.sh"'

      - name: Implement
        id: claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1' # ADR-0029, as in implement
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The dispatcher dispatches with the workflow's token, so the actor is github-actions[bot],
          # and the action refuses bots it isn't told about; verify has already checked the ticket.
          allowed_bots: github-actions[bot]
          prompt: |
            The dispatcher started you on issue #${{ env.ISSUE }} (ADR-0047). The ticket is in
            .factory/ticket.md. Follow "Started by the dispatcher" in your instructions and return
            the structured output.
          # As in implement: the timeout is the real limit.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 250
            --permission-mode acceptEdits
            --append-system-prompt-file ${{ runner.temp }}/implementer.md
            --add-dir ${{ runner.temp }}/user-report
            --allowedTools "Edit,Write,MultiEdit,Bash(cd:*),Bash(pnpm check),Bash(pnpm check:effect),Bash(pnpm check:deps),Bash(pnpm check:adrs),Bash(pnpm check:format),Bash(pnpm check:boundaries),Bash(pnpm prettier:*),Bash(pnpm audit:*),Bash(pnpm format:*),Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm typecheck),Bash(pnpm test:*),Bash(pnpm --filter @roundtable/web test:*),Bash(pnpm --filter @roundtable/api test:*),Bash(pnpm vitest:*),Bash(pnpm db:generate:*),Bash(pnpm --filter @roundtable/web test:browser:*),Bash(pnpm --filter @roundtable/web test:mutation:*),Bash(pnpm --filter @roundtable/api test:mutation:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git commit:*),Bash(git push),Bash(git push origin:*),Bash(git push -u origin:*),Bash(git fetch:*),Bash(git merge:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(ls:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(pnpm exec:*),Bash(pnpm dlx:*),Bash(pnpx:*),Bash(npx:*),Bash(git config:*),Bash(git remote:*),Bash(git -c:*),Bash(git --config-env:*),Bash(git --config-env=*),Bash(git credential:*),Read(./.git/**),Grep(./.git/**),Glob(./.git/**),Edit(./.git/**),Write(./.git/**),Edit(./.github/**),Write(./.github/**),Edit(./.claude/**),Write(./.claude/**),Edit(./CLAUDE.md),Write(./CLAUDE.md)"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["built","needs-info"]},"branch":{"type":"string"},"summary":{"type":"string"}},"required":["outcome","summary"],"additionalProperties":false}'

      - name: Explain a failed run
        id: failure
        if: always() && steps.claude.outcome == 'failure'
        run: '"$RUNNER_TEMP/explain-failure.sh" agent'

      # As in implement (ADR-0029).
      - name: Report denied tool calls
        id: denials
        if: always()
        run: '"$RUNNER_TEMP/report-denials.sh"'
      # What the agent did, for the batch retrospective (ADR-0064): a shaped trail, never its text.
      - name: Keep the agent's trail
        if: always() && steps.report.outputs.fetched != 'true'
        run: '"$RUNNER_TEMP/agent-trail.sh" build'
      - uses: actions/upload-artifact@v7
        if: always() && steps.report.outputs.fetched != 'true'
        with:
          name: agent-trail-issue-${{ env.ISSUE }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-trail/trail.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Flag a suspicious run
        if: always() && steps.denials.outputs.suspicious == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ env.ISSUE }}
        run: '"$RUNNER_TEMP/flag-suspicious.sh"'

      # Deterministic, as in implement: what the agent left, whatever it reported. It names its
      # branch; one outside claude/issue-<n>- isn't trusted.
      # Also when a step before the agent failed (the install, the report fetch): the ticket goes
      # back to the owner instead of holding the queue. Not for a ticket the load step refused.
      # What the agent published, found without trusting what it says: every pull request the
      # Claude App opened since this run started, every branch for this ticket, and the branch it
      # names. The checks and takedowns below cover all of them. Deliberately strict: the factory
      # builds one ticket at a time and `@claude` works on existing pull requests, so another
      # pull request opened in this window is suspicious, even from another ticket's branch name,
      # which a misled agent could borrow.
      - name: Find what the agent published
        id: published
        if: always() && steps.ticket.outputs.refused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.claude.outputs.structured_output || steps.failure.outputs.result }}
        run: |
          start=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          opened=$(gh pr list --state all --author app/claude --search "created:>=$start" --limit 50 --json number,headRefName)
          heads=$( {
            jq -r '.branch // empty' <<<"${RESULT:-{\}}"
            jq -r '.[].headRefName' <<<"$opened"
            gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq ".[].name | select(startswith(\"claude/issue-$ISSUE-\"))"
          } | sort -u | tr '\n' ' ')
          {
            echo "heads=$heads"
            echo "prs=$(jq -r '[.[].number] | join(" ")' <<<"$opened")"
          } >>"$GITHUB_OUTPUT"

      # Not after a suspicious run: that ticket keeps `building`, holding the queue, until a human
      # has looked (ADR-0047). The takedowns below still run.
      - name: Check the result
        id: result
        if: always() && steps.ticket.outputs.refused != 'true' && steps.denials.outputs.suspicious != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.claude.outputs.structured_output || steps.failure.outputs.result }}
          REASON: ${{ steps.failure.outputs.reason }}
          HEADS: ${{ steps.published.outputs.heads }}
          REPORT: ${{ steps.report.outputs.fetched }}
          DESCRIPTION: ${{ runner.temp }}/report-guard/description.txt
        run: |
          outcome=$(jq -r '.outcome // "failed"' <<<"${RESULT:-{\}}")
          summary=$(jq -r --arg why "${REASON:-}" '.summary // ("The implementer stopped without a summary" + (if $why == "" then "" else ": " + $why end) + ". See the run log.")' <<<"${RESULT:-{\}}")
          branch=$(jq -r '.branch // ""' <<<"${RESULT:-{\}}")
          [[ "$branch" == "claude/issue-$ISSUE-"* ]] || branch=""

          # Anything it published outside this ticket's branches, or that touches the factory's own
          # rules, goes to a human whatever it reported. The ticket keeps `building`, so nothing
          # else starts until someone has looked.
          for head in $HEADS; do
            reason="" code=0
            if [[ "$head" != "claude/issue-$ISSUE-"* ]]; then
              reason="pushed \`$head\`, which isn't one of this ticket's branches"
            else
              "$RUNNER_TEMP/protected-changes.sh" main "$head" >/dev/null || code=$?
              case "$code" in
                0) ;;
                1) reason="changed \`.github/\`, \`.claude/\` or \`CLAUDE.md\` on \`$head\`, which the implementer may not touch" ;;
                *) reason="pushed \`$head\`, which GitHub couldn't compare with main, so it wasn't checked for changes to the factory's own rules" ;;
              esac
            fi
            if [ -n "$reason" ]; then
              gh issue edit "$ISSUE" --add-label needs-human
              gh issue comment "$ISSUE" --body "The factory's agent $reason. Don't merge anything from this run until a human has looked: [the run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). ADR-0047."
              echo "::error::The agent $reason"
              exit 1
            fi
          done

          # Never publish what looks like a credential (ADR-0029), or a user's report (ADR-0041).
          if ! "$RUNNER_TEMP/guard-secrets.sh" <<<"$summary"; then
            summary="The implementer's answer was withheld because it matched a credential pattern. See the run, and rotate the credential."
          elif [ "$REPORT" = true ] && ! "$RUNNER_TEMP/guard-report-text.sh" "$DESCRIPTION" <<<"$summary" >/dev/null; then
            summary="Stopped: I couldn't reproduce this from the report."
          fi

          # Stopped or failed: the ticket goes back to the owner and stops holding the queue.
          # shellcheck disable=SC2016 # backticks are Markdown
          needs_info() {
            gh issue edit "$ISSUE" --remove-label ready --remove-label building --add-label needs-info
            body=$(printf '%s\n\n<sub>[Run](%s). Answer, then label it `ready` again. ADR-0047.</sub>\n' \
              "$summary" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            gh issue comment "$ISSUE" --body "$body"
            exit 0
          }
          [ "$outcome" = built ] && [ -n "$branch" ] || needs_info
          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$branch" 2>/dev/null) || needs_info
          [ "$(echo "$compare" | jq .ahead_by)" -gt 0 ] || needs_info

          if [ "$(gh pr list --head "$branch" --state all --json number --jq length)" = 0 ]; then
            body=$(printf 'Closes #%s\n\nThe implementer pushed this branch but did not open the pull request. **CI has not run: close and reopen this PR to start it.**' "$ISSUE")
            gh pr create --base main --head "$branch" --title "$(gh issue view "$ISSUE" --json title --jq .title)" --body "$body" --label factory --draft
          fi

          # Built: what the agent would have said in its closing comment, after the same guards. On a
          # user report, only the step: the issue is the public face of a private report (ADR-0041),
          # and what was found belongs in the pull request.
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number')
          [ "$REPORT" != true ] || summary="Opened the pull request: #$pr"
          gh issue comment "$ISSUE" --body "$(printf '%s\n\n<sub>Pull request #%s, from [this run](%s). ADR-0047.</sub>\n' \
            "$summary" "$pr" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"

      # The agent's sandbox can't write .github/, .claude/ or CLAUDE.md, so its `git merge
      # origin/main` is refused once main has changed them (the owner's edits after a retro), and
      # the owner merged by hand (retro #241). Merged here instead, by main's script, in a fresh
      # checkout of the branch the check above accepted: only when main changed nothing else, and
      # never through a conflict, which the conflict resolver takes (ADR-0058). Pushed with a fresh
      # Claude App token, so CI and the reviewer run on the merge (ADR-0072).
      - uses: actions/checkout@v7
        if: always() && steps.result.outputs.branch != ''
        with:
          ref: ${{ steps.result.outputs.branch }}
          path: .factory-merge
          fetch-depth: 0
          persist-credentials: false
      - name: Merge main if only the factory's own files changed there
        if: always() && steps.result.outputs.branch != ''
        working-directory: .factory-merge
        # A push that fails leaves a pull request behind main, which may merge (ADR-0035): the
        # error is annotated, and the steps below still run.
        continue-on-error: true
        env:
          BRANCH: ${{ steps.result.outputs.branch }}
        run: '"$RUNNER_TEMP/merge-main.sh" "$BRANCH"'

      # Every pull request found above, and any from the branches found (ADR-0029). The agent can't
      # comment, but it writes pull request descriptions.
      - name: Take down anything that looks like a credential
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ env.ISSUE }}
          HEADS: ${{ steps.published.outputs.heads }}
          OPENED: ${{ steps.published.outputs.prs }}
        run: |
          PRS="$OPENED $(for head in $HEADS; do gh pr list --head "$head" --state all --json number --jq '.[].number'; done)" \
            "$RUNNER_TEMP/takedown-credentials.sh"

      # As in implement (ADR-0041).
      - name: Take down anything that quotes the user's report
        if: always() && steps.report.outputs.fetched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ env.ISSUE }}
          HEADS: ${{ steps.published.outputs.heads }}
          DESCRIPTION: ${{ runner.temp }}/report-guard/description.txt
        run: |
          # Once per branch it published; without one, still once for its comments.
          status=0
          for head in ${HEADS:-""}; do
            BRANCH=$head "$RUNNER_TEMP/takedown-report-quotes.sh" || status=1
          done
          exit "$status"

  # Which failing pull request to fix, if any, and which attempt this is. Holds no secrets.
  select-fix:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # attempt.sh, from main
      pull-requests: write
      issues: write
    outputs:
      pr: ${{ steps.pick.outputs.pr }}
      sha: ${{ steps.pick.outputs.sha }}
      branch: ${{ steps.pick.outputs.branch }}
      attempt: ${{ steps.pick.outputs.attempt }}
    steps:
      # attempt.sh decides, from main like this file (ADR-0028).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/factory/attempt.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$RUN_BRANCH" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || { echo "No open pull request for $RUN_BRANCH."; exit 0; }

          # A factory or autofix pull request still at the failed commit, not waiting for a human,
          # with fewer than two fixes since a human last pushed; at two, attempt.sh hands it over.
          attempt=$(EXPECT_SHA=$RUN_SHA .github/factory/attempt.sh next ci-fix "$pr")
          case "$attempt" in [0-9]*) ;; *) exit 0 ;; esac

          {
            echo "pr=$pr"
            echo "sha=$RUN_SHA"
            echo "branch=$RUN_BRANCH"
            echo "attempt=$attempt"
          } >> "$GITHUB_OUTPUT"

  fix-ci:
    needs: select-fix
    if: needs.select-fix.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: factory
    # Shared with the Rework workflow's runs on this branch, so the two never push to it at once.
    concurrency:
      group: factory-${{ needs.select-fix.outputs.branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # re-runs failed jobs when the failure isn't the pull request's fault
      id-token: write # exchanged for the Claude GitHub App's short-lived token
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      PR: ${{ needs.select-fix.outputs.pr }}
      SHA: ${{ needs.select-fix.outputs.sha }}
      BRANCH: ${{ needs.select-fix.outputs.branch }}
      ATTEMPT: ${{ needs.select-fix.outputs.attempt }}
    steps:
      # Waiting for this branch's group can take a while, and the job that held it (a fix or a
      # rework) may have pushed. Then this failure is stale: the new commit gets its own runs.
      - name: Is the commit still the head?
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$head" != "$SHA" ]; then
            echo "#$PR has moved past $SHA; its own runs decide."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      # main first, for the instructions; then the pull request's branch to work on. Neither keeps
      # this job's token: a push made with it starts CI only after a manual approval
      # ("action_required"), and the action's cleanup misses where checkout v7 stores it. The
      # only credential left is the Claude App's, which the action sets on the remote.
      - uses: actions/checkout@v7
        if: steps.current.outputs.stale != 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load the implementer's instructions and the secret guard from main
        if: steps.current.outputs.stale != 'true'
        run: |
          cp .github/factory/implementer.md .github/factory/install-browsers.sh .github/factory/guard-secrets.sh .github/factory/report-denials.sh .github/factory/agent-trail.sh \
            .github/factory/explain-failure.sh .github/factory/flag-suspicious.sh \
            .github/factory/protected-changes.sh .github/factory/attempt.sh "$RUNNER_TEMP/"
      # From main too, before the branch replaces the workspace: it runs with sudo.
      - uses: ./.github/actions/isolate-agent
        if: steps.current.outputs.stale != 'true'
      - uses: actions/checkout@v7
        if: steps.current.outputs.stale != 'true'
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.current.outputs.stale != 'true'
      # No dependency cache here (ADR-0030): this job's caches are saved under main, and what it
      # installs comes from a branch, so a cache it saved could reach CI and deploy on main.
      - uses: actions/setup-node@v7
        if: steps.current.outputs.stale != 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # The lockfile may be what's broken; the agent reinstalls if so.
      - run: pnpm install --frozen-lockfile
        if: steps.current.outputs.stale != 'true'
        continue-on-error: true
      # Chromium for the browser tests the agent writes and runs (ADR-0066), by main's script:
      # it runs with sudo, and no code from the branch does.
      - name: Install Chromium for the browser tests
        run: '"$RUNNER_TEMP/install-browsers.sh"'
        if: steps.current.outputs.stale != 'true'

      - name: Fix CI
        if: steps.current.outputs.stale != 'true'
        id: claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1' # ADR-0029, as in the implement job
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CI on factory and Dependabot pull requests is started by those bots, and the action
          # checks the upstream run's actor; select-fix already decided this pull request is ours.
          allowed_bots: claude[bot],dependabot[bot]
          prompt: |
            CI failed on pull request #${{ env.PR }} (branch ${{ env.BRANCH }}, commit ${{ env.SHA }}).
            The failed run: ${{ github.event.workflow_run.html_url }} (${{ github.event.workflow_run.name }}).
            This is fix attempt ${{ env.ATTEMPT }} of 2. The branch is checked out. Follow "Fixing CI"
            in your instructions and return the structured output.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 100
            --permission-mode acceptEdits
            --append-system-prompt-file ${{ runner.temp }}/implementer.md
            --allowedTools "Edit,Write,MultiEdit,Bash(cd:*),Bash(pnpm check),Bash(pnpm check:effect),Bash(pnpm check:deps),Bash(pnpm check:adrs),Bash(pnpm check:format),Bash(pnpm check:boundaries),Bash(pnpm prettier:*),Bash(pnpm audit:*),Bash(pnpm format:*),Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm typecheck),Bash(pnpm test:*),Bash(pnpm --filter @roundtable/web test:*),Bash(pnpm --filter @roundtable/api test:*),Bash(pnpm vitest:*),Bash(pnpm db:generate:*),Bash(pnpm --filter @roundtable/web test:browser:*),Bash(pnpm --filter @roundtable/web test:mutation:*),Bash(pnpm --filter @roundtable/api test:mutation:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git commit:*),Bash(git push),Bash(git push origin:*),Bash(git fetch:*),Bash(git merge:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(ls:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh run rerun:*),Bash(gh api repos/${{ github.repository }}/check-runs:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(pnpm exec:*),Bash(pnpm dlx:*),Bash(pnpx:*),Bash(npx:*),Bash(git config:*),Bash(git remote:*),Bash(git -c:*),Bash(git --config-env:*),Bash(git --config-env=*),Bash(git credential:*),Read(./.git/**),Grep(./.git/**),Glob(./.git/**),Edit(./.git/**),Write(./.git/**),Edit(./.github/**),Write(./.github/**),Edit(./.claude/**),Write(./.claude/**),Edit(./CLAUDE.md),Write(./CLAUDE.md)"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["fixed","reran","needs-human"]},"summary":{"type":"string"}},"required":["outcome","summary"],"additionalProperties":false}'

      - name: Explain a failed run
        id: failure
        if: always() && steps.claude.outcome == 'failure' && steps.current.outputs.stale != 'true'
        run: '"$RUNNER_TEMP/explain-failure.sh" fixer'

      # Lists what the agent was refused, and flags the run for a human if it reached for
      # credentials or the factory's own rules (ADR-0029).
      - name: Report denied tool calls
        id: denials
        if: always() && steps.current.outputs.stale != 'true'
        run: '"$RUNNER_TEMP/report-denials.sh"'
      # What the agent did, for the batch retrospective (ADR-0064): a shaped trail, never its text.
      - name: Keep the agent's trail
        if: always() && steps.current.outputs.stale != 'true'
        run: '"$RUNNER_TEMP/agent-trail.sh" fix-ci'
      - uses: actions/upload-artifact@v7
        if: always() && steps.current.outputs.stale != 'true'
        with:
          name: agent-trail-pr-${{ env.PR }}-fix-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-trail/trail.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Flag a suspicious run
        if: always() && steps.denials.outputs.suspicious == 'true' && steps.current.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ env.PR }}
        run: '"$RUNNER_TEMP/flag-suspicious.sh"'

      # Deterministic: what the fixer pushed, and one marked comment per attempt (select-fix counts
      # them). Runs even when the agent failed, so a failed attempt still counts.
      - name: Check and report the attempt
        if: always() && steps.current.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.claude.outputs.structured_output || steps.failure.outputs.result }}
          REASON: ${{ steps.failure.outputs.reason }}
        run: '"$RUNNER_TEMP/attempt.sh" report ci-fix'
