# The software factory's reviewer (ADR-0026): a second agent, with its own instructions and no
# stake in the change, reviews a pull request against its ticket and the repo's rules, then
# updates one review comment. It never approves; the owner merges.
#
# It reviews every pull request from this repository, except Dependabot's own (until someone else,
# such as the CI fixer, pushes to one), once CI passes on each new commit (ADR-0033), and any pull
# request the owner labels `review` at once. Both triggers run
# this file from `main`, never from a branch, and the pull request's code is only read, never run.
#
# When it asks for changes on a factory pull request, the Rework workflow takes over (ADR-0037).
name: Review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  # Which pull request and commit, if any. Cheap, and holds no secrets.
  select:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
        github.event.label.name == 'review' &&
        github.actor == github.repository_owner &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write # the factory status (ADR-0063)
    outputs:
      pr: ${{ steps.pick.outputs.pr }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          LABELED_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            pr=$LABELED_PR
          else
            pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$RUN_BRANCH" --state open --json number --jq '.[0].number // empty')
            [ -n "$pr" ] || { echo "No open pull request for $RUN_BRANCH."; exit 0; }
          fi

          info=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefOid,author,commits)
          sha=$(echo "$info" | jq -r .headRefOid)

          if [ "$EVENT" = workflow_run ]; then
            # A newer commit gets its own CI run, and its own review.
            [ "$sha" = "$RUN_SHA" ] || { echo "#$pr has moved past $RUN_SHA."; exit 0; }
            # Dependabot's own bumps aren't reviewed (ADR-0033), but once the CI fixer or anyone
            # else has pushed to one, that code is reviewed like any other (ADR-0028).
            echo "$info" | jq -e '(.author.login | test("dependabot") | not)
              or any(.commits[]; any(.authors[]; (.login // "") | test("dependabot") | not))' >/dev/null ||
              { echo "#$pr has only Dependabot's commits."; exit 0; }
          fi

          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The factory status (ADR-0063): the pull request page shows the factory working on this
      # commit until the status job below, or Rework after it, says it's done.
      - uses: actions/checkout@v7
        if: steps.pick.outputs.pr != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/factory/factory-status.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Mark the commit as under review
        if: steps.pick.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: '.github/factory/factory-status.sh pending "Working: reviewing"'

  review:
    needs: select
    if: needs.select.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: factory
    # A newer commit's review replaces one still running for an older commit.
    concurrency:
      group: review-${{ needs.select.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      verdict: ${{ steps.post.outputs.verdict }}
      minor: ${{ steps.post.outputs.minor }}
    env:
      PR: ${{ needs.select.outputs.pr }}
      SHA: ${{ needs.select.outputs.sha }}
    steps:
      # The working directory is main: the reviewer's instructions, CLAUDE.md and Claude Code's
      # own settings all come from there, so a pull request can't change them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load the secret guard, the denial report and the poster from main
        run: cp .github/factory/guard-secrets.sh .github/factory/report-denials.sh .github/factory/post-review.sh "$RUNNER_TEMP/"
      - uses: ./.github/actions/isolate-agent
      # The pull request's code, to read. Nothing in it is installed or run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          path: pr
          persist-credentials: false

      # The implementer's replies to earlier reviews of a factory pull request (ADR-0037). Only the
      # factory's own: anyone can comment on a pull request in a public repository.
      - name: Load the rework replies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rework
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- factory-rework -->"))) | .body + "\n\n---\n"' \
            > rework/replies.md

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1' # ADR-0029: what it runs gets no Anthropic credentials
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This job's own token, not the Claude App's: the App's token exchange rejects runs started
          # by pull_request_target ("Invalid OIDC token"), and the reviewer only reads; the step
          # below posts its comment with this same token.
          github_token: ${{ github.token }}
          # The factory's pushes start CI as the Claude App, so it's the upstream actor here.
          allowed_bots: claude[bot]
          prompt: |
            Review pull request #${{ env.PR }} in ${{ github.repository }} at commit ${{ env.SHA }}.
            Its code is checked out in ./pr/. Follow your instructions and return the structured output.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --permission-mode default
            --append-system-prompt-file ${{ github.workspace }}/.github/factory/reviewer.md
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"integer","minimum":0},"review":{"type":"string"}},"required":["blocking","review"],"additionalProperties":false}'

      - name: Explain a failed run
        if: always() && steps.claude.outcome == 'failure'
        run: |
          file="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$file" ] || { echo "::error::The reviewer failed before writing its output."; exit 0; }
          reason=$(jq -r '[.[] | select(.type == "result")] | last | (.result // (.errors // [] | join(", "))) // "no result message"' "$file" | head -c 1000)
          echo "::error::The reviewer failed: $reason"

      # Lists what the agent was refused, and flags the run for a human if it reached for
      # credentials or the factory's own rules (ADR-0029).
      - name: Report denied tool calls
        id: denials
        if: always()
        run: '"$RUNNER_TEMP/report-denials.sh"'
      - name: Flag a suspicious run
        if: always() && steps.denials.outputs.suspicious == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ env.PR }}
        run: |
          gh issue edit "$NUMBER" -R "$GITHUB_REPOSITORY" --add-label needs-human
          gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "The factory's agent tried tool calls that reach for credentials or the factory's own rules, and was refused. A human should read [the run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) (its summary lists the calls) before anything here is merged. ADR-0029."
          exit 1

      # One review comment per pull request, updated in place on every new commit, plus a short new
      # comment when a re-review asks for changes, which Auto-fix can see (ADR-0046). The script
      # sets the verdict from the blocking findings, not the reviewer (ADR-0053).
      - name: Post the review
        id: post
        if: steps.claude.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          # Never publish what looks like a credential (ADR-0029).
          "$RUNNER_TEMP/guard-secrets.sh" <<<"$RESULT" || exit 1
          "$RUNNER_TEMP/post-review.sh"

      # What the Rework workflow reads to decide whether to run (ADR-0037): the pull request, the
      # commit, the verdict and the number of minor findings (ADR-0053), all checked above. The review's text stays in the comment.
      - name: Record the verdict
        if: steps.post.outputs.verdict != ''
        env:
          VERDICT: ${{ steps.post.outputs.verdict }}
          MINOR: ${{ steps.post.outputs.minor }}
        run: |
          jq -n --argjson pr "$PR" --arg sha "$SHA" --arg verdict "$VERDICT" --argjson minor "${MINOR:-0}" \
            '{pr: $pr, sha: $sha, verdict: $verdict, minor: $minor}' > "$RUNNER_TEMP/verdict.json"
      - uses: actions/upload-artifact@v7
        if: steps.post.outputs.verdict != ''
        with:
          name: review-verdict
          path: ${{ runner.temp }}/verdict.json
          retention-days: 7

  # The factory status once the review is over (ADR-0063): done, unless Rework takes the pull
  # request from here and sets its own, or stopped if the review didn't finish. A job of its own, so
  # the reviewer's job, which runs the agent, gets no permission to set statuses. A review cancelled
  # for a newer commit leaves its commit alone: the pull request page shows only the newest.
  status:
    needs: [select, review]
    if: always() && needs.select.outputs.pr != '' && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels: does Rework take it from here?
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/factory/factory-status.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set the factory status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.select.outputs.pr }}
          SHA: ${{ needs.select.outputs.sha }}
          RESULT: ${{ needs.review.result }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          MINOR: ${{ needs.review.outputs.minor }}
        run: |
          if [ "$RESULT" = success ] && [ -n "$VERDICT" ]; then
            .github/factory/factory-status.sh --reviewed
          else
            .github/factory/factory-status.sh error "Stopped: the review didn't finish. See the run, or label the pull request review to rerun it"
          fi
