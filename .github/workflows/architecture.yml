# The factory's architecture review (ADR-0031, ADR-0067): an agent runs Matt Pocock's
# improve-codebase-architecture skill (vendored in .github/factory/skills/) over the code that
# changed recently, unattended, and writes the skill's HTML report. Retro starts it when a spec's
# batch closes; the Monday run is a backstop that skips itself when main hasn't changed since the
# last review. Each `Strong` candidate becomes
# an `architecture` issue in the ticket form's shape; the owner labels it `ready` to have the
# implementer build it, or closes it with a reason so the next run doesn't suggest it again.
#
# Read-only like the reviewer: it runs from main, changes no code, and a deterministic step creates
# the issues from its structured output.
name: Architecture review

on:
  schedule:
    - cron: '17 7 * * 1' # Mondays
  workflow_dispatch:
    inputs:
      spec:
        description: The spec (parent issue) whose batch just closed, set by Retro. Empty runs the review even if main hasn't changed.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: architecture-review
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # lists the earlier reviews
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/factory
      - name: Has main changed since the last review?
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SPEC: ${{ inputs.spec }}
          SHA: ${{ github.sha }}
        run: .github/factory/select-architecture.sh "$EVENT" "$SHA" "$SPEC"

  review:
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: factory
    permissions:
      contents: read
      issues: write # the deterministic step creates the issues; the agent only reads them
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the skill reads the commit history to find hot spots
          persist-credentials: false
      - name: Load the instructions, the secret guard, the denial report and the issue finder from main
        run: cp .github/factory/architect.md .github/factory/guard-secrets.sh .github/factory/report-denials.sh .github/factory/find-architecture-issue.sh "$RUNNER_TEMP/"
      - uses: ./.github/actions/isolate-agent

      - name: Review the architecture
        id: claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1' # ADR-0029; also forces explicit tool rules
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # It only reads, so the job's own token is enough (the App's token exchange refuses
          # some events, ADR-0026).
          github_token: ${{ github.token }}
          prompt: |
            Run an architecture review of ${{ github.repository }}${{ inputs.spec && format(', now that the batch of spec #{0} has landed', inputs.spec) || '' }},
            following your instructions, and return the structured output.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 100
            --permission-mode default
            --append-system-prompt-file ${{ runner.temp }}/architect.md
            --allowedTools "Read,Glob,Grep,Task,Agent,Edit(./architecture-report/**),Write(./architecture-report/**),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*),Bash(ls:*),Bash(gh issue list:*),Bash(gh issue view:*)"
            --disallowedTools "WebFetch,WebSearch,Read(./.git/**),Grep(./.git/**),Glob(./.git/**)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["candidates","top_recommendation"],"properties":{"top_recommendation":{"type":"string"},"candidates":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["title","strength","files","problem","solution","benefits","adr_conflict","questions","glossary","acceptance_criteria","out_of_scope"],"properties":{"title":{"type":"string"},"strength":{"type":"string","enum":["Strong","Worth exploring","Speculative"]},"files":{"type":"array","items":{"type":"string"}},"problem":{"type":"string"},"solution":{"type":"string"},"benefits":{"type":"string"},"adr_conflict":{"type":"string"},"questions":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["question","recommendation"],"properties":{"question":{"type":"string"},"recommendation":{"type":"string"}}}},"glossary":{"type":"array","items":{"type":"string"}},"acceptance_criteria":{"type":"array","items":{"type":"string"}},"out_of_scope":{"type":"string"}}}}}}'

      - name: Explain a failed run
        if: always() && steps.claude.outcome == 'failure'
        run: |
          file="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$file" ] || { echo "::error::The architecture review failed before writing its output."; exit 0; }
          reason=$(jq -r '[.[] | select(.type == "result")] | last | (.result // (.errors // [] | join(", "))) // "no result message"' "$file" | head -c 1000)
          echo "::error::The architecture review failed: $reason"

      - name: Report denied tool calls
        id: denials
        if: always()
        run: '"$RUNNER_TEMP/report-denials.sh"'

      # A suspicious run publishes nothing (ADR-0029).
      - name: Stop a suspicious run
        if: always() && steps.denials.outputs.suspicious == 'true'
        run: |
          echo "::error::The architecture review tried tool calls that reach for credentials or the factory's rules. Nothing was published; read the run."
          exit 1

      - uses: actions/upload-artifact@v7
        if: steps.claude.outcome == 'success'
        with:
          name: architecture-report
          path: architecture-report/
          retention-days: 30

      - name: Open issues for Strong candidates
        if: steps.claude.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ORIGIN: "${{ inputs.spec && format('after the batch of #{0} closed', inputs.spec) || github.event_name == 'schedule' && 'weekly' || 'started by hand' }}"
        run: |
          "$RUNNER_TEMP/guard-secrets.sh" <<<"$RESULT" || exit 1

          {
            echo '## Architecture review'
            echo
            jq -r '.candidates[] | "- **\(.strength)**: \(.title)"' <<<"$RESULT"
            echo
            echo "**Top recommendation:** $(jq -r .top_recommendation <<<"$RESULT")"
            echo
            echo "The full report is this run's architecture-report artifact."
          } >> "$GITHUB_STEP_SUMMARY"

          jq -c '.candidates[] | select(.strength == "Strong")' <<<"$RESULT" | while read -r candidate; do
            title="Architecture: $(jq -r .title <<<"$candidate")"
            # The weekly and per-batch runs can both find a candidate (ADR-0067): skip one an open
            # issue tracks, or one closed in the last 30 days, by exact title.
            existing=$("$RUNNER_TEMP/find-architecture-issue.sh" "$title")
            if [ -n "$existing" ]; then
              echo "#$existing already tracks \"$title\", or closed it in the last 30 days."
              continue
            fi

            body=$(jq -r --arg run "$RUN_URL" --arg origin "$ORIGIN" '
              "### Problem\n\n\(.problem)\n\n" +
              "### Proposed change\n\n\(.solution)\n\n" +
              "### Benefits\n\n\(.benefits)\n\n" +
              "### Files\n\n" + (.files | map("- `\(.)`") | join("\n")) + "\n\n" +
              (if .adr_conflict != "" then "### ADR conflict\n\n\(.adr_conflict)\n\n" else "" end) +
              "### Decisions, with recommendations\n\nThe questions the skill would have asked you. Labeling this `ready` accepts every recommendation; to change one, say so in a comment first.\n\n" +
              (.questions | map("- **\(.question)** Recommended: \(.recommendation)") | join("\n")) + "\n\n" +
              "### Acceptance criteria\n\n" +
              (.acceptance_criteria | map("- \(.)") | join("\n")) + "\n" +
              "- Given the deepened module, then it is tested through its interface, and the tests of the shallow modules it replaces are deleted, not kept alongside: each behavior they checked is checked by a test at the new interface. Every other existing test still passes.\n" +
              "- Given the decisions above, then the change follows each recommendation unless a comment from the owner changes it.\n\n" +
              "### Out of scope\n\n\(.out_of_scope)\n\n" +
              "### Docs impact\n\nAn ADR if this changes a module'"'"'s interface across modules or departs from an existing ADR; `docs/architecture.md` if components move." +
              (if (.glossary | length) > 0 then " Proposed `GLOSSARY.md` entries:\n\n" + (.glossary | map("- \(.)") | join("\n")) else "" end) +
              "\n\n<sub>From the architecture review run \($origin) ([run](\($run)), ADR-0031, ADR-0067). Not labeled `ready`: that is the owner'"'"'s call.</sub>"
            ' <<<"$candidate")

            "$RUNNER_TEMP/guard-secrets.sh" <<<"$body" || continue
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label architecture --label enhancement --body "$body"
          done
