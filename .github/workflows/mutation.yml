# Mutation testing (ADR-0027, ADR-0039), nightly on main: Stryker changes the code in small ways
# and reports every change no test notices. Pull requests don't run it: a full API run takes about
# half an hour on a runner, and one that timed out left a factory pull request stuck. Advisory: it
# never fails on the score, only if Stryker itself can't run. The score and the survivors go to
# each job's summary and its artifact (`web-mutation-report`, `api-mutation-report`). Then `file`
# opens the factory's next mutation ticket from them (ADR-0051).
#
# Incremental (ADR-0062): each job restores the last run's Stryker results from the cache and
# mutates only what changed since. Stryker sees changes to the files it mutates and to test files,
# nothing else, so the cache key hashes everything else the results depend on (dependencies,
# config, test helpers, the contract, migrations, files left out of `mutate`): change one, and
# that run is full. Sunday's run, and a manual run with `full`, skip the cache, which also corrects
# the results incremental mode keeps after a new test kills an old survivor.
#
# It also runs on pull requests that change this file, so a change to it is tested before it lands,
# except Dependabot's: a bump of an action used here gets its first run the next night (ADR-0062).
name: Mutation testing

on:
  schedule:
    - cron: '17 3 * * 1-6' # nightly, incremental
    - cron: '17 3 * * 0' # Sunday, full: keep in step with FULL below
  workflow_dispatch:
    inputs:
      full:
        description: Mutate everything, ignoring the last run's results
        type: boolean
        default: false
  pull_request:
    paths: [.github/workflows/mutation.yml]

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  FULL: ${{ github.event.schedule == '17 3 * * 0' || inputs.full == true }}

jobs:
  # The web app. A full run had 1,118 mutants and needed about 24 minutes on a runner (2026-11-23).
  web:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Key the results on what Stryker can't see
        id: key
        env:
          UNSEEN: >-
            ${{ hashFiles('pnpm-lock.yaml', '.node-version', 'tsconfig.base.json',
            'packages/contract/src/**', 'apps/web/*', 'apps/web/src/**/*.css',
            'apps/web/src/test-setup.ts', 'apps/web/src/shared/testing/**',
            'apps/web/src/main.tsx', 'apps/web/src/**/index.ts') }}
        run: echo "prefix=mutation-web-$UNSEEN-" >> "$GITHUB_OUTPUT"
      - name: Restore the last run's results
        if: env.FULL != 'true'
        uses: actions/cache/restore@v6
        with:
          path: apps/web/reports/stryker-incremental.json
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Mutate the web app
        run: pnpm --filter @roundtable/web test:mutation
      - name: Report the score and the survivors
        env:
          REPORT: apps/web/reports/mutation/mutation.json
        run: |
          {
            echo '## Mutation testing (web)'
            echo
            jq -r '
              [.files[].mutants[]] as $all
              | ([$all[] | select(.status == "Killed" or .status == "Timeout")] | length) as $killed
              | ([$all[] | select(.status == "Survived")] | length) as $survived
              | ([$all[] | select(.status == "NoCoverage")] | length) as $uncovered
              | "\($all | length) mutants: \($killed) killed, \($survived) survived, \($uncovered) not covered by any test. "
                + "Score \(if ($killed + $survived + $uncovered) > 0 then (100 * $killed / ($killed + $survived + $uncovered) | floor) else 0 end)%, "
                + "\(if ($killed + $survived) > 0 then (100 * $killed / ($killed + $survived) | floor) else 0 end)% of covered code."' "$REPORT"
            echo
            echo '### Survivors'
            echo
            jq -r '[.files | to_entries[] | .key as $f | .value.mutants[] | select(.status == "Survived" or .status == "NoCoverage")
              | "- `apps/web/\($f):\(.location.start.line)` \(.status): \(.mutatorName), `` \(.replacement | gsub("\n"; " ") | .[0:80]) ``"]
              | if length == 0 then "None." else .[] end' "$REPORT"
          } > survivors.md

          cat survivors.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p web-mutation-report
          mv survivors.md web-mutation-report/
          cp "$REPORT" web-mutation-report/
      - name: Save the results for the next run
        uses: actions/cache/save@v6
        with:
          path: apps/web/reports/stryker-incremental.json
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        with:
          name: web-mutation-report
          path: web-mutation-report/
          retention-days: 14

  api:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # About 7 minutes on a laptop with four workers. A full run on a runner passed 60 minutes on
    # 2026-11-23.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      # Each Stryker worker creates and migrates its own copy, app_test_<worker>.
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Key the results on what Stryker can't see
        id: key
        env:
          UNSEEN: >-
            ${{ hashFiles('pnpm-lock.yaml', '.node-version', 'tsconfig.base.json',
            'packages/contract/src/**', 'apps/api/*', 'apps/api/test/**', 'apps/api/drizzle/**',
            'apps/api/src/main.ts', 'apps/api/src/migrate.ts', 'apps/api/src/**/index.ts',
            'apps/api/src/**/schema.ts', 'apps/api/src/platform/database/columns.ts') }}
        run: echo "prefix=mutation-api-$UNSEEN-" >> "$GITHUB_OUTPUT"
      - name: Restore the last run's results
        if: env.FULL != 'true'
        uses: actions/cache/restore@v6
        with:
          path: apps/api/reports/stryker-incremental.json
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Mutate the API
        run: pnpm --filter @roundtable/api test:mutation
      - name: Report the score and the survivors
        env:
          REPORT: apps/api/reports/mutation/mutation.json
        run: |
          {
            echo '## Mutation testing (API)'
            echo
            jq -r '
              [.files[].mutants[]] as $all
              | ([$all[] | select(.status == "Killed" or .status == "Timeout")] | length) as $killed
              | ([$all[] | select(.status == "Timeout")] | length) as $timeouts
              | ([$all[] | select(.status == "Survived")] | length) as $survived
              | ([$all[] | select(.status == "NoCoverage")] | length) as $uncovered
              | "\($all | length) mutants: \($killed) killed (\($timeouts) by timing out), \($survived) survived, \($uncovered) not covered by any test. "
                + "Score \(if ($killed + $survived + $uncovered) > 0 then (100 * $killed / ($killed + $survived + $uncovered) | floor) else 0 end)%, "
                + "\(if ($killed + $survived) > 0 then (100 * $killed / ($killed + $survived) | floor) else 0 end)% of covered code."' "$REPORT"
            echo
            echo 'Each survivor left on 2026-11-19 is reviewed in ADR-0027 (equivalent or untestable); a new one is worth a look.'
            echo
            echo '### Survivors'
            echo
            jq -r '[.files | to_entries[] | .key as $f | .value.mutants[] | select(.status == "Survived" or .status == "NoCoverage")
              | "- `apps/api/\($f):\(.location.start.line)` \(.status): \(.mutatorName), `` \(.replacement | gsub("\n"; " ") | .[0:80]) ``"]
              | if length == 0 then "None." else .[] end' "$REPORT"
          } > survivors.md

          # A timed-out mutant counts as killed, so a slow runner can hide survivors behind
          # timeouts (ADR-0027). A clean run has one or two.
          timeouts=$(jq '[.files[].mutants[] | select(.status == "Timeout")] | length' "$REPORT")
          if [ "$timeouts" -gt 10 ]; then
            echo "::warning::$timeouts mutants timed out, which counts them as killed: survivors may be hidden. Rerun before trusting the score."
            printf '\n> [!WARNING]\n> %s mutants timed out, which counts them as killed: survivors may be hidden. Rerun before trusting the score.\n' "$timeouts" >> survivors.md
          fi

          cat survivors.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p api-mutation-report
          mv survivors.md api-mutation-report/
          cp "$REPORT" api-mutation-report/
      - name: Save the results for the next run
        uses: actions/cache/save@v6
        with:
          path: apps/api/reports/stryker-incremental.json
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        with:
          name: api-mutation-report
          path: api-mutation-report/
          retention-days: 14

  # The factory's mutation tickets (ADR-0051, ADR-0052): for the files with the most mutants no test
  # detects, `mutation` issues this job labels `ready`, so the dispatcher builds them without waiting
  # for the owner, after the owner's own tickets. It tops up to five open, one per file. Only from main: anywhere else
  # (a pull request that changes this file, a manual run on a branch) it prints the ticket instead.
  file:
    needs: [web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # creates the ticket and the `mutation` label
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/factory
      - uses: actions/download-artifact@v8
        with:
          path: reports
      - name: File the next mutation ticket
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
        run: >-
          .github/factory/file-mutation-issue.sh
          apps/web=reports/web-mutation-report/mutation.json
          apps/api=reports/api-mutation-report/mutation.json
