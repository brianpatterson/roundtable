name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repo. Grant more per job if one ever needs it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing here pushes, and actionlint's image reads the tree
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm check:format
      - name: Typecheck
        run: pnpm typecheck
      # Every shell script in the repo, the factory's guards included. .shellcheckrc lists the
      # notes switched off and why.
      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      # The workflows: expressions, job references, action inputs, and ShellCheck on each `run:`
      # script. Dependabot doesn't update an image run this way: bump the tag and digest together.
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD":/repo:ro -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      # Effect-specific mistakes stock tsc can't see (an Effect never run, `yield` without `*`).
      # Annotated inline on the PR.
      - name: Effect diagnostics
        run: pnpm check:effect --format github-actions
      - name: Dependency register is complete
        run: pnpm check:deps
      # Two pull requests can take the same ADR number without a git conflict (ADR-0058).
      - name: ADR numbers and index
        run: pnpm check:adrs
      # Every test-*.sh in .github/factory/, scripts/ and deploy/, so a new one runs without being
      # listed here: a factory ticket can add one, and its sandbox can't edit this file (retro
      # #281). Each script's header names what it pins and the ADR behind it. All run, then the
      # step fails if any did, with one error line per failed script.
      - name: Script tests
        run: |
          failed=0
          for test in .github/factory/test-*.sh scripts/test-*.sh deploy/test-*.sh; do
            echo "::group::$test"
            "$test" || { failed=1; echo "::error file=$test::$test failed"; }
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          git diff --exit-code -- apps/api/drizzle || {
            echo "::error::schema.ts changed without a migration. Run 'pnpm db:generate --name <change>' and commit it."
            exit 1
          }
          test -z "$(git status --porcelain -- apps/api/drizzle)" || {
            echo "::error::Uncommitted migration generated. Run 'pnpm db:generate' and commit it."
            exit 1
          }
      - name: Test
        run: pnpm test
      # Every new migration works with the previous release's code (ADR-0073): judged against
      # main's schema, then replayed through `pre` and `post` on this job's Postgres. It needs
      # main, which the checkout doesn't fetch. On a push to main nothing is new, so it passes.
      - name: Migrations are safe for the previous release
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          pnpm check:migrations

  # Playwright against the built web app and the real API (ADR-0065): keyboard and focus, an axe
  # scan, and screenshots at phone and desktop widths in both themes, uploaded for the reviewer.
  # No secrets: the API runs with test values on CI's Postgres, and emails go to its log.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium only: the phone project is Chromium at a phone's size. Keyed on Playwright's
      # version, which pins the browser build.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @roundtable/web exec playwright --version)" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @roundtable/web exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @roundtable/web exec playwright install-deps chromium
      - name: Browser tests
        run: pnpm --filter @roundtable/web test:browser
      # Screenshots and the HTML report (with traces of failures), pass or fail. Not the rest of
      # test-results/: artifacts are public here, and it holds the test user's session cookie
      # (auth.json) and the test API's log (ADR-0066).
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests
          path: |
            apps/web/test-results/screenshots/
            apps/web/test-results/report/
          retention-days: 14

  # Stryker on a mutation ticket's one file (ADR-0051), on the factory's pull request for it, so
  # the reviewer reads which mutants are left instead of taking the implementer's word (ADR-0069).
  # Other pull requests skip it after one `gh` call. Advisory: a failure or a timeout leaves the
  # reviewer a "not verified" report, never a red or cancelled CI, which would hold the review
  # back (it starts on a successful CI). So Stryker's own step has the time limit and may fail;
  # the job's limit is only a backstop. No secrets: the API's tests run on CI's Postgres.
  mutation:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
      issues: read # the ticket's label and title
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      # Each Stryker worker creates and migrates its own copy, app_test_<worker>.
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      # The factory names its branch after the ticket (claude/issue-<n>-…). Only a `mutation`
      # ticket whose title names a plain source file in one of the apps gets a run.
      - name: Find the ticket's file
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          [[ "$BRANCH" =~ ^claude/issue-([0-9]+)- ]] || { echo "Not a ticket's branch."; exit 0; }
          n=${BASH_REMATCH[1]}
          ticket=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json labels,title) ||
            { echo "No issue #$n."; exit 0; }
          jq -e 'any(.labels[]; .name == "mutation")' <<<"$ticket" >/dev/null ||
            { echo "#$n isn't a mutation ticket."; exit 0; }
          title=$(jq -r .title <<<"$ticket")
          [[ "$title" =~ ^Mutation:\ test\ \`apps/(web|api)/(src/[A-Za-z0-9_./-]+\.tsx?)\`$ ]] && [[ "$title" != *..* ]] ||
            { echo "::warning::Can't read a source file from the title of #$n."; exit 0; }
          {
            echo "app=${BASH_REMATCH[1]}"
            echo "file=${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.target.outputs.file != ''
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.target.outputs.file != ''
      - uses: actions/setup-node@v7
        if: steps.target.outputs.file != ''
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.target.outputs.file != ''
        run: pnpm install --frozen-lockfile
      # `--force`: a fresh checkout has no incremental results, but nothing here should reuse them.
      # The web app's file takes seconds; the API's a few minutes on a laptop.
      - name: Mutate the file
        if: steps.target.outputs.file != ''
        timeout-minutes: 25
        continue-on-error: true
        env:
          APP: ${{ steps.target.outputs.app }}
          FILE: ${{ steps.target.outputs.file }}
        run: pnpm --filter "@roundtable/$APP" test:mutation --mutate "$FILE" --force
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.target.outputs.file != '' }}
        with:
          name: mutation-check
          path: apps/${{ steps.target.outputs.app }}/reports/mutation/mutation.json
          if-no-files-found: ignore
          retention-days: 14

  # The production images must build. They're not pushed here; the deploy pipeline does that.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    env:
      TF_INPUT: 0 # fail instead of waiting for input that will never come
      # Reuse downloaded providers between runs: faster, and a GitHub release-download outage
      # (504s on every provider, 2026-11-09) no longer fails the job once they're cached.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v7
      - name: Cache OpenTofu providers
        uses: actions/cache@v6
        with:
          path: .tofu-plugin-cache
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # The default wrapper captures tofu's output for later steps, but it breaks piped stdin, so
          # `tofu console` in test-cloud-init.sh hung until the job timed out.
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      # Providers download anonymously from GitHub releases, which time out during GitHub
      # incidents. Retry with backoff (~5 minutes in total) before failing the job.
      - name: tofu init (with retries)
        run: |
          for attempt in 1 2 3 4 5; do
            tofu init -backend=false && exit 0
            echo "::warning::tofu init failed (attempt $attempt of 5), retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1
      - run: tofu validate
      # What the factory's clock sends GitHub on each tick (ADR-0060).
      - name: Factory clock Worker
        run: node --test factory-clock/worker.test.js
      - name: cloud-init creates the expected users
        run: ./test-cloud-init.sh
