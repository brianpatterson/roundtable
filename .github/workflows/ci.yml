name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repo. Grant more per job if one ever needs it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm prettier --check .
      - name: Typecheck
        run: pnpm typecheck
      # Effect-specific mistakes stock tsc can't see (an Effect never run, `yield` without `*`).
      # Annotated inline on the PR.
      - name: Effect diagnostics
        run: pnpm check:effect --format github-actions
      - name: Dependency register is complete
        run: pnpm check:deps
      # How the factory's denial report classifies refused commands (ADR-0029).
      - name: Denial report fixtures
        run: .github/factory/test-report-denials.sh
      # How the security auditor's findings are filed as advisories (ADR-0036).
      - name: Advisory filing fixtures
        run: .github/factory/test-file-advisories.sh
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          git diff --exit-code -- apps/api/drizzle || {
            echo "::error::schema.ts changed without a migration. Run 'pnpm db:generate --name <change>' and commit it."
            exit 1
          }
          test -z "$(git status --porcelain -- apps/api/drizzle)" || {
            echo "::error::Uncommitted migration generated. Run 'pnpm db:generate' and commit it."
            exit 1
          }
      - name: Test
        run: pnpm test

  # Mutation testing (ADR-0027), advisory: Stryker changes the web app's code in small ways and
  # reports every change no test notices. It never fails on the score; it fails only if Stryker
  # itself can't run. The reviewer reads the survivors from this run's artifact (ADR-0026).
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # which files the pull request changed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The whole web app takes about 20 seconds, so every run is a full run.
      - name: Mutate the web app
        run: pnpm --filter @roundtable/web test:mutation
      - name: Report the survivors
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: apps/web/reports/mutation/mutation.json
        run: |
          changed=$(gh pr diff "$PR" -R "$GITHUB_REPOSITORY" --name-only | sed -n 's|^apps/web/||p' | jq -R . | jq -s .)

          {
            echo '## Mutation testing (web)'
            echo
            jq -r '
              [.files[].mutants[]] as $all
              | ([$all[] | select(.status == "Killed" or .status == "Timeout")] | length) as $killed
              | ([$all[] | select(.status == "Survived")] | length) as $survived
              | ([$all[] | select(.status == "NoCoverage")] | length) as $uncovered
              | "\($all | length) mutants: \($killed) killed, \($survived) survived, \($uncovered) not covered by any test. "
                + "Score \(if ($killed + $survived + $uncovered) > 0 then (100 * $killed / ($killed + $survived + $uncovered) | floor) else 0 end)%, "
                + "\(if ($killed + $survived) > 0 then (100 * $killed / ($killed + $survived) | floor) else 0 end)% of covered code."' "$REPORT"
            echo
            echo '### Survivors in files this pull request changed'
            echo
            jq -r --argjson changed "$changed" '
              [.files | to_entries[] | select(.key as $f | $changed | index($f)) | .key as $f
                | .value.mutants[] | select(.status == "Survived" or .status == "NoCoverage")
                | "- `apps/web/\($f):\(.location.start.line)` \(.status): \(.mutatorName), `` \(.replacement | gsub("\n"; " ") | .[0:80]) ``"]
              | if length == 0 then "None." else .[] end' "$REPORT"
            echo
            echo '<details><summary>All survivors</summary>'
            echo
            jq -r '.files | to_entries[] | .key as $f | .value.mutants[] | select(.status == "Survived")
              | "- `apps/web/\($f):\(.location.start.line)` \(.mutatorName), `` \(.replacement | gsub("\n"; " ") | .[0:80]) ``"' "$REPORT"
            echo
            echo '</details>'
          } > survivors.md

          cat survivors.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p mutation-report && mv survivors.md mutation-report/ && cp "$REPORT" mutation-report/
      - uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: mutation-report/
          retention-days: 14

  # Mutation testing for the API (ADR-0027), advisory like the web job. A full run takes minutes
  # against Postgres, so a pull request reuses the nightly run's results on main
  # (mutation.yml's `api-mutation-report`) and mutates only what changed. Stryker's incremental
  # mode sees only mutated source and test files, so a change to anything else it depends on
  # (test helpers, migrations, tables, the contract, config, dependencies) gets a full run.
  # Skipped when the pull request doesn't touch the API. The reviewer reads the survivors.
  api-mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # which files the pull request changed
      actions: read # the nightly run's report
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      # Each Stryker worker creates and migrates its own copy, app_test_<worker>.
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Decide how to run
        id: plan
        run: |
          gh pr diff "$PR" -R "$GITHUB_REPOSITORY" --name-only > changed.txt
          # What could change the API's behavior: its code, the contract, the dependencies.
          grep -E '^(apps/api/|packages/contract/|pnpm-lock\.yaml$)' changed.txt > relevant.txt || true
          # What incremental results can't see: everything but the source files Stryker mutates and
          # the test files beside them. Drizzle tables aren't mutated, so they're unseen too.
          {
            grep -v -E '^apps/api/src/.*\.ts$' relevant.txt || true
            grep -E '^apps/api/src/(.*/)?(schema|columns)\.ts$' relevant.txt || true
          } > unseen.txt

          if [ ! -s relevant.txt ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "No API changes: nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
          elif [ -s unseen.txt ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            {
              echo "Full run: incremental results can't see changes to"
              while read -r file; do echo "- \`$file\`"; done < unseen.txt
            } > plan.md
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse the nightly results
        if: steps.plan.outputs.mode == 'incremental'
        run: |
          # Only a scheduled or manual run on main: no pull request can plant a baseline.
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow mutation.yml --branch main --status success --limit 20 \
            --json databaseId,event,headBranch \
            --jq '[.[] | select((.event == "schedule" or .event == "workflow_dispatch") and .headBranch == "main")][0].databaseId // empty')

          if [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n api-mutation-report -D baseline; then
            mkdir -p apps/api/reports
            cp baseline/stryker-incremental.json apps/api/reports/
            echo "Incremental: reusing the results of nightly run $run on main." > plan.md
          else
            echo "Full run: no nightly results on main to reuse yet." > plan.md
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.plan.outputs.mode != 'skip'
      - uses: actions/setup-node@v7
        if: steps.plan.outputs.mode != 'skip'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.plan.outputs.mode != 'skip'
        run: pnpm install --frozen-lockfile
      - name: Mutate the API
        if: steps.plan.outputs.mode != 'skip'
        run: |
          set -o pipefail # fail if Stryker fails, not only tee
          pnpm --filter @roundtable/api test:mutation | tee stryker.log
      - name: Report the survivors
        if: steps.plan.outputs.mode != 'skip'
        env:
          REPORT: apps/api/reports/mutation/mutation.json
        run: |
          changed=$(sed -n 's|^apps/api/||p' changed.txt | jq -R . | jq -s .)

          {
            echo '## Mutation testing (API)'
            echo
            cat plan.md
            grep -o '[0-9]* of [0-9]* mutant result(s) are reused' stryker.log | sed 's/^/Stryker: /; s/$/./' || true
            echo
            jq -r '
              [.files[].mutants[]] as $all
              | ([$all[] | select(.status == "Killed" or .status == "Timeout")] | length) as $killed
              | ([$all[] | select(.status == "Survived")] | length) as $survived
              | ([$all[] | select(.status == "NoCoverage")] | length) as $uncovered
              | "\($all | length) mutants: \($killed) killed, \($survived) survived, \($uncovered) not covered by any test. "
                + "Score \(if ($killed + $survived + $uncovered) > 0 then (100 * $killed / ($killed + $survived + $uncovered) | floor) else 0 end)%, "
                + "\(if ($killed + $survived) > 0 then (100 * $killed / ($killed + $survived) | floor) else 0 end)% of covered code."' "$REPORT"
            echo
            echo '### Survivors in files this pull request changed'
            echo
            jq -r --argjson changed "$changed" '
              [.files | to_entries[] | select(.key as $f | $changed | index($f)) | .key as $f
                | .value.mutants[] | select(.status == "Survived" or .status == "NoCoverage")
                | "- `apps/api/\($f):\(.location.start.line)` \(.status): \(.mutatorName), `` \(.replacement | gsub("\n"; " ") | .[0:80]) ``"]
              | if length == 0 then "None." else .[] end' "$REPORT"
            echo
            echo 'Survivors elsewhere are reviewed in ADR-0027 (equivalent or untestable) and listed in the nightly run.'
          } > survivors.md

          cat survivors.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p api-mutation-report && mv survivors.md api-mutation-report/ && cp "$REPORT" api-mutation-report/
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.mode != 'skip'
        with:
          name: api-mutation-report
          path: api-mutation-report/
          retention-days: 14

  # The production images must build. They're not pushed here; the deploy pipeline does that.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    env:
      TF_INPUT: 0 # fail instead of waiting for input that will never come
      # Reuse downloaded providers between runs: faster, and a GitHub release-download outage
      # (504s on every provider, 2026-11-09) no longer fails the job once they're cached.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v7
      - name: Cache OpenTofu providers
        uses: actions/cache@v6
        with:
          path: .tofu-plugin-cache
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # The default wrapper captures tofu's output for later steps, but it breaks piped stdin, so
          # `tofu console` in test-cloud-init.sh hung until the job timed out.
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      - name: ShellCheck (deploy and infra scripts)
        run: shellcheck ../deploy/*.sh test-cloud-init.sh
      # Providers download anonymously from GitHub releases, which time out during GitHub
      # incidents. Retry with backoff (~5 minutes in total) before failing the job.
      - name: tofu init (with retries)
        run: |
          for attempt in 1 2 3 4 5; do
            tofu init -backend=false && exit 0
            echo "::warning::tofu init failed (attempt $attempt of 5), retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1
      - run: tofu validate
      - name: cloud-init creates the expected users
        run: ./test-cloud-init.sh
