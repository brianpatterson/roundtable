# The software factory's rework task (ADR-0037): when the reviewer asks for changes on one of the
# factory's pull requests, the implementer fixes what the review named on the same branch and
# pushes. CI and the reviewer then run again on the new commit. Two attempts, then it stops and
# asks for a human, as the CI fixer does (ADR-0028).
#
# A review whose findings are all minor gets one pass too (ADR-0053), which doesn't count against
# the two attempts; later minor-only reviews are left for the owner. A blocker's rework fixes the
# minor findings alongside it.
#
# Only main's Review workflow finishing starts it (select checks which run), so it always runs
# this file and the implementer's instructions from `main`, and the `factory` environment, which
# holds the Claude token, only admits `main`. A branch can't change what the agent is told or
# reach the token.
name: Rework

on:
  workflow_run:
    workflows: [Review]
    types: [completed]

permissions:
  contents: read

jobs:
  # Which pull request to rework, if any, and which attempt this is. Holds no secrets.
  select:
    # `workflows: [Review]` matches by name, so a fork's pull request could run its own workflow
    # called Review, with a forged verdict record. Only main's review.yml, run by its own triggers
    # (which always run from main), counts.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/review.yml' &&
      contains(fromJSON('["workflow_run","pull_request_target"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the review's verdict record
      pull-requests: write
      issues: write
      statuses: write # the factory status (ADR-0063)
    outputs:
      pr: ${{ steps.pick.outputs.pr }}
      sha: ${{ steps.pick.outputs.sha }}
      branch: ${{ steps.pick.outputs.branch }}
      attempt: ${{ steps.pick.outputs.attempt }}
      kind: ${{ steps.pick.outputs.kind }}
    steps:
      # The factory status script (ADR-0063), from main like this file.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/factory/factory-status.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          MARKER: '<!-- factory-rework -->'
          MINOR_MARKER: '<!-- factory-rework-minor -->'
        run: |
          # The review job records its verdict only once it has posted it (review.yml).
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n review-verdict -D "$RUNNER_TEMP/verdict" ||
            { echo "Review run $RUN posted no verdict."; exit 0; }
          record="$RUNNER_TEMP/verdict/verdict.json"
          pr=$(jq -r '.pr | select(type == "number")' "$record")
          reviewed=$(jq -r '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$record")
          [ -n "$pr" ] && [ -n "$reviewed" ] || { echo "::error::Run $RUN's verdict record is malformed."; exit 1; }
          minor=$(jq -r '(.minor | select(type == "number" and . >= 0)) // 0' "$record")
          case "$(jq -r .verdict "$record")" in
            changes) kind=changes ;;
            ready)
              [ "$minor" -gt 0 ] || { echo "#$pr: ready, with no findings to fix."; exit 0; }
              kind=minor ;;
            *) echo "::error::Run $RUN's verdict record is malformed."; exit 1 ;;
          esac

          info=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json state,headRefOid,headRefName,isCrossRepository,labels,commits)
          labels=$(jq -c '[.labels[].name]' <<<"$info")

          [ "$(jq -r .state <<<"$info")" = OPEN ] || { echo "#$pr isn't open."; exit 0; }
          # A newer commit gets its own CI run, review and, if needed, rework.
          [ "$(jq -r .headRefOid <<<"$info")" = "$reviewed" ] || { echo "#$pr has moved past $reviewed."; exit 0; }
          # The factory status on the reviewed commit (ADR-0063). The Review workflow has already
          # set it as done on every pull request the checks below turn away.
          status() { SHA=$reviewed .github/factory/factory-status.sh "$@"; }
          # Only the factory's own pull requests: a branch of this repository, labeled `factory`.
          jq -e '.isCrossRepository | not' <<<"$info" >/dev/null || { echo "#$pr is from a fork."; exit 0; }
          jq -e 'any(. == "factory")' <<<"$labels" >/dev/null || { echo "#$pr isn't a factory pull request."; exit 0; }
          ! jq -e 'any(. == "needs-human")' <<<"$labels" >/dev/null || { echo "#$pr is waiting for a human."; exit 0; }

          # Reworks since the last commit a human pushed: a push from the owner resets the count.
          since=$(jq -r '[.commits[] | select(all(.authors[]; (.login // "") | test("^(claude|dependabot)") | not)) | .committedDate] | max // "1970-01-01T00:00:00Z"' <<<"$info")
          reworks=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\")) and .created_at > \"$since\") | .body]" |
            jq -s 'add // []')
          # The minor pass doesn't count against the two attempts.
          attempts=$(jq --arg m "$MINOR_MARKER" '[.[] | select(contains($m) | not)] | length' <<<"$reworks")

          # One minor pass per pull request: what later minor-only reviews find is the owner's call.
          if [ "$kind" = minor ]; then
            [ "$(jq --arg m "$MINOR_MARKER" '[.[] | select(contains($m))] | length' <<<"$reworks")" -eq 0 ] ||
              { echo "#$pr: ready; it has had its minor pass, so its minor findings are the owner's."
                status success "Done: ready for you; the minor findings are yours"; exit 0; }
            status pending "Working: fixing the minor findings"
            { echo "pr=$pr"; echo "sha=$reviewed"; echo "branch=$(jq -r .headRefName <<<"$info")"; echo "kind=minor"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${attempts:-0}" -ge 2 ]; then
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --add-label needs-human
            gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body "The factory reworked this pull request twice and the reviewer still asks for changes. Over to you: push a fix. To hand it back, push a commit yourself (that resets the count) and remove \`needs-human\`; it tries again on the next \`changes\` verdict. ADR-0037."
            status success "Done: over to you, reworked twice and changes are still asked (needs-human)"
            exit 0
          fi
          status pending "Working: reworking, attempt $(( ${attempts:-0} + 1 )) of 2"

          {
            echo "pr=$pr"
            echo "sha=$reviewed"
            echo "branch=$(jq -r .headRefName <<<"$info")"
            echo "attempt=$(( ${attempts:-0} + 1 ))"
            echo "kind=changes"
          } >> "$GITHUB_OUTPUT"

  rework:
    needs: select
    if: needs.select.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: factory
    # The same group as the CI fixer's job on this branch, so the two never push to it at once.
    # A Review run's own branch is always `main`, so it can't key a workflow-level group.
    concurrency:
      group: factory-${{ needs.select.outputs.branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # lets the agent read CI results on the pull request
      id-token: write # exchanged for the Claude GitHub App's short-lived token
    outputs:
      stale: ${{ steps.current.outputs.stale }}
      outcome: ${{ steps.report.outputs.outcome }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      PR: ${{ needs.select.outputs.pr }}
      SHA: ${{ needs.select.outputs.sha }}
      BRANCH: ${{ needs.select.outputs.branch }}
      ATTEMPT: ${{ needs.select.outputs.attempt }}
      KIND: ${{ needs.select.outputs.kind }}
      MINOR_MARKER: '<!-- factory-rework-minor -->'
    steps:
      # Waiting for this branch's group can take a while, and the job that held it (a fix or a
      # rework) may have pushed. Then this review is stale: the new commit gets its own runs.
      - name: Is the commit still the head?
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$head" != "$SHA" ]; then
            echo "#$PR has moved past $SHA; its own runs decide."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      # As in the CI fixer (ADR-0028): main first, for the instructions; then the pull request's
      # branch to work on. Neither keeps this job's token, so the only credential left is the
      # Claude App's, which the action sets on the remote, and its pushes start CI.
      - uses: actions/checkout@v7
        if: steps.current.outputs.stale != 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load the implementer's instructions and the secret guard from main
        if: steps.current.outputs.stale != 'true'
        run: |
          cp .github/factory/implementer.md .github/factory/guard-secrets.sh .github/factory/report-denials.sh \
            .github/factory/protected-changes.sh "$RUNNER_TEMP/"
      # From main too, before the branch replaces the workspace: it runs with sudo.
      - uses: ./.github/actions/isolate-agent
        if: steps.current.outputs.stale != 'true'
      - uses: actions/checkout@v7
        if: steps.current.outputs.stale != 'true'
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.current.outputs.stale != 'true'
      # No dependency cache here (ADR-0030): this job's caches are saved under main, and what it
      # installs comes from a branch, so a cache it saved could reach CI and deploy on main.
      - uses: actions/setup-node@v7
        if: steps.current.outputs.stale != 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        if: steps.current.outputs.stale != 'true'

      # Only the factory's own comments reach the agent as the review: anyone can comment on a
      # pull request in a public repository. `.factory/` is git-ignored.
      - name: Gather the review
        if: steps.current.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .factory
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- factory-review -->") or startswith("<!-- factory-rework -->"))) | .body + "\n\n---\n"' \
            > .factory/review.md
          grep -q '<!-- factory-review -->' .factory/review.md || { echo "::error::#$PR has no factory review."; exit 1; }

      - name: Brief the agent
        if: steps.current.outputs.stale != 'true'
        id: brief
        run: |
          if [ "$KIND" = minor ]; then
            brief="The reviewer found no blocking findings on pull request #$PR (branch $BRANCH, commit $SHA), only minor ones: its review is in .factory/review.md. This is the factory's one pass over minor findings (ADR-0053); later minor findings are left for the owner. The branch is checked out. Follow \"Reworking a review\" in your instructions and return the structured output. If no finding is worth changing, push nothing and return needs-human with your reasons: on this pass that only leaves them for the owner."
          else
            brief="The reviewer asked for changes on pull request #$PR (branch $BRANCH, commit $SHA): its review, and earlier rework replies, are in .factory/review.md. This is rework attempt $ATTEMPT of 2. The branch is checked out. Follow \"Reworking a review\" in your instructions and return the structured output."
          fi
          { echo 'prompt<<BRIEF'; echo "$brief"; echo BRIEF; } >> "$GITHUB_OUTPUT"

      - name: Rework
        if: steps.current.outputs.stale != 'true'
        id: claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1' # ADR-0029, as in the Factory workflow
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The factory's pushes start CI, and so the review, as the Claude App; the action checks
          # the upstream run's actor. select already decided this pull request is the factory's.
          allowed_bots: claude[bot]
          prompt: ${{ steps.brief.outputs.prompt }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 100
            --permission-mode acceptEdits
            --append-system-prompt-file ${{ runner.temp }}/implementer.md
            --allowedTools "Edit,Write,MultiEdit,Bash(cd:*),Bash(pnpm check),Bash(pnpm check:effect),Bash(pnpm check:deps),Bash(pnpm check:boundaries),Bash(pnpm prettier:*),Bash(pnpm audit:*),Bash(pnpm format:*),Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm typecheck),Bash(pnpm test:*),Bash(pnpm --filter @roundtable/web test:*),Bash(pnpm --filter @roundtable/api test:*),Bash(pnpm vitest:*),Bash(pnpm db:generate:*),Bash(pnpm --filter @roundtable/web test:mutation),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git commit:*),Bash(git push),Bash(git push origin:*),Bash(git fetch:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(ls:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(pnpm exec:*),Bash(pnpm dlx:*),Bash(pnpx:*),Bash(npx:*),Bash(git config:*),Bash(git remote:*),Bash(git -c:*),Bash(git --config-env:*),Bash(git --config-env=*),Bash(git credential:*),Read(./.git/**),Grep(./.git/**),Glob(./.git/**),Edit(./.git/**),Write(./.git/**),Edit(./.github/**),Write(./.github/**),Edit(./.claude/**),Write(./.claude/**),Edit(./CLAUDE.md),Write(./CLAUDE.md)"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["fixed","needs-human"]},"summary":{"type":"string"}},"required":["outcome","summary"],"additionalProperties":false}'

      - name: Explain a failed run
        if: always() && steps.claude.outcome == 'failure' && steps.current.outputs.stale != 'true'
        run: |
          file="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$file" ] || { echo "::error::The rework agent failed before writing its output."; exit 0; }
          reason=$(jq -r '[.[] | select(.type == "result")] | last | (.result // (.errors // [] | join(", "))) // "no result message"' "$file" | head -c 1000)
          echo "::error::The rework agent failed: $reason"

      # Lists what the agent was refused, and flags the run for a human if it reached for
      # credentials or the factory's own rules (ADR-0029).
      - name: Report denied tool calls
        id: denials
        if: always() && steps.current.outputs.stale != 'true'
        run: '"$RUNNER_TEMP/report-denials.sh"'
      - name: Flag a suspicious run
        if: always() && steps.denials.outputs.suspicious == 'true' && steps.current.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ env.PR }}
        run: |
          gh issue edit "$NUMBER" -R "$GITHUB_REPOSITORY" --add-label needs-human
          gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "The factory's agent tried tool calls that reach for credentials or the factory's own rules, and was refused. A human should read [the run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) (its summary lists the calls) before anything here is merged. ADR-0029."
          exit 1

      # Deterministic: what the agent pushed, whatever it reported, and one marked comment per
      # attempt (select counts them). Runs even when the agent failed, so a failed attempt counts.
      - name: Check and report the attempt
        id: report
        if: always() && steps.current.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          outcome=$(jq -r '.outcome // "failed"' <<<"${RESULT:-{\}}")
          summary=$(jq -r '.summary // "The rework agent stopped without a summary; see the run log."' <<<"${RESULT:-{\}}")

          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$BRANCH" 2>/dev/null) || compare='{}'

          # "fixed" means commits on the branch; without any, CI and the review won't run again.
          if [ "$outcome" = fixed ] && [ "$(jq '.ahead_by // 0' <<<"$compare")" -eq 0 ]; then
            outcome=needs-human
            summary=$(printf '%s\n\n_The agent reported a fix but pushed no commits._' "$summary")
          fi

          # The agent never changes its own rules or CI. If GitHub can't say what it pushed, a human
          # checks: a check that can't run mustn't pass.
          code=0
          "$RUNNER_TEMP/protected-changes.sh" "$SHA" "$BRANCH" >/dev/null || code=$?
          case "$code" in
            0) ;;
            1)
              outcome=protected
              summary="The rework changed \`.github/\`, \`.claude/\` or \`CLAUDE.md\`, which the factory may not touch. Don't merge it until a human has looked."
              ;;
            *)
              outcome=unchecked
              summary=$(printf '%s\n\n_GitHub couldn'"'"'t compare the branch with commit %s, so what the rework pushed wasn'"'"'t checked for changes to the factory'"'"'s own rules. Check it before merging._' "$summary" "$SHA")
              ;;
          esac

          # On the minor pass the pull request is already the owner's turn: nothing pushed leaves
          # the findings for them, without asking for a human.
          if [ "$KIND" = minor ]; then
            title='Rework, minor findings' extra="$MINOR_MARKER"$'\n'
            case "$outcome" in
              fixed) head="pushed changes; CI and the reviewer run again" ;;
              protected | unchecked) head="over to you"; gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label needs-human ;;
              *) head="pushed nothing; the minor findings are yours" ;;
            esac
          else
            title="Rework, attempt $ATTEMPT of 2" extra=
            case "$outcome" in
              fixed) head="pushed changes; CI and the reviewer run again" ;;
              *) head="over to you"; gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label needs-human ;;
            esac
          fi

          # Never publish what looks like a credential (ADR-0029).
          if ! "$RUNNER_TEMP/guard-secrets.sh" <<<"$summary"; then
            summary="The rework agent's summary was withheld because it matched a credential pattern. See the run, and rotate the credential."
          fi

          body=$(printf '<!-- factory-rework -->\n%s### %s: %s\n\n%s\n\n<sub>[Run](%s), answering the review of commit %s. ADR-0037, ADR-0053.</sub>\n' \
            "$extra" "$title" "$head" "$summary" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$SHA")
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          [ "$outcome" != protected ] || exit 1

  # The factory status on the reviewed commit once the rework is over (ADR-0063). A job of its own,
  # so the agent's job gets no permission to set statuses. A pushed fix leaves it: the new commit is
  # the one the pull request page shows, and its own review sets its status. Anything else is the
  # owner's turn, or, if the rework didn't finish, stopped.
  status:
    needs: [select, rework]
    if: always() && needs.select.outputs.pr != '' && needs.rework.outputs.stale != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/factory/factory-status.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set the factory status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.select.outputs.sha }}
          KIND: ${{ needs.select.outputs.kind }}
          OUTCOME: ${{ needs.rework.outputs.outcome }}
        run: |
          case "$KIND:$OUTCOME" in
            *:fixed) echo "The rework pushed a fix; the new commit's review sets its status." ;;
            *:protected) .github/factory/factory-status.sh error "Stopped: the rework changed the factory's own files. Check it before merging (needs-human)" ;;
            *:unchecked) .github/factory/factory-status.sh success "Done: over to you, check what the rework pushed before merging (needs-human)" ;;
            minor:?*) .github/factory/factory-status.sh success "Done: ready for you; the minor findings are yours" ;;
            changes:?*) .github/factory/factory-status.sh success "Done: over to you, the rework didn't fix the review (needs-human)" ;;
            *) .github/factory/factory-status.sh error "Stopped: the rework didn't finish. See the run" ;;
          esac
