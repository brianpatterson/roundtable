# The factory's conflict resolver (ADR-0058): when main moves and a factory pull request now
# conflicts with it, the implementer merges main into the branch, resolves the conflict and pushes.
# CI and the reviewer then run again on the merge. A conflict usually comes from two pull requests
# taking the same ADR number (#105, #149, #155): the later one is renumbered. When the agent
# can't resolve it, or what it pushed fails the checks, a human takes over. A run that crashes
# gets one retry against the same main commit, then a human.
#
# Started by CI passing on main (every merge), and by the sweeper (ADR-0040) through
# workflow_dispatch when it finds a conflict that run missed. Only a green main is merged in: a
# broken one would fail every pull request it reached, and the CI fixer would spend its attempts
# there on main's failure. Both run this file and the implementer's instructions from `main`, and
# the `factory` environment, which holds the Claude token, only admits `main`. A branch can't change
# what the agent is told or reach the token.
name: Resolve conflicts

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: The factory pull request to check (the sweeper starts these); empty checks them all
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Which pull requests conflict with main, and which attempt this is for each. Holds no secrets.
  select:
    # `workflows: [CI]` matches by name and `branches` by the head branch's name, so a fork's pull
    # request from a branch called main could run a workflow called CI. Only main's own push counts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.path == '.github/workflows/ci.yml' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # main's latest CI run
      pull-requests: write # labels and comments
      issues: write # labels and comments go through the issues API
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
      main: ${{ steps.pick.outputs.main }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/factory
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          # The main every attempt this run makes merges, and counts against.
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          # Only once CI has passed on it. If main is red or still running, the run that ends green
          # (CI on the fix, or this commit's) starts this again.
          ci=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$main" --event push --limit 1 \
            --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          if [ "$ci" != "completed success" ]; then
            echo "CI on main ${main:0:7} hasn't passed (${ci:-no run}); merging nothing."
            { echo "prs=[]"; echo "main=$main"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prs=$(MAIN=$main .github/factory/select-conflicts.sh "${PR:-}")
          echo "To resolve: $prs"
          { echo "prs=$prs"; echo "main=$main"; } >> "$GITHUB_OUTPUT"

  resolve:
    needs: select
    if: needs.select.outputs.prs != '[]' && needs.select.outputs.prs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: factory
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.prs) }}
    # The same group as the CI fixer's and the rework's jobs on this branch, so they never push to
    # it at once.
    concurrency:
      group: factory-${{ matrix.branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # exchanged for the Claude GitHub App's short-lived token
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      PR: ${{ matrix.pr }}
      SHA: ${{ matrix.sha }}
      BRANCH: ${{ matrix.branch }}
      ATTEMPT: ${{ matrix.attempt }}
      MAIN: ${{ needs.select.outputs.main }}
    steps:
      # Waiting for this branch's group can take a while, and the job that held it may have pushed.
      # Then the new commit gets its own CI run, and a later sweep or merge decides again.
      - name: Is the commit still the head?
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$head" != "$SHA" ]; then
            echo "#$PR has moved past $SHA."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      # As in the CI fixer (ADR-0028): main first, for the instructions; then the pull request's
      # branch to work on. Neither keeps this job's token, so the only credential left is the
      # Claude App's, which the action sets on the remote, and its pushes start CI.
      - uses: actions/checkout@v7
        if: steps.current.outputs.stale != 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load the implementer's instructions and the guards from main
        if: steps.current.outputs.stale != 'true'
        run: |
          cp .github/factory/implementer.md .github/factory/guard-secrets.sh .github/factory/report-denials.sh \
            .github/factory/explain-failure.sh .github/factory/flag-suspicious.sh \
            .github/factory/report-conflict-attempt.sh .github/factory/protected-changes.sh "$RUNNER_TEMP/"
      # From main too, before the branch replaces the workspace: it runs with sudo.
      - uses: ./.github/actions/isolate-agent
        if: steps.current.outputs.stale != 'true'
      # Full history: the merge needs the common ancestor.
      - uses: actions/checkout@v7
        if: steps.current.outputs.stale != 'true'
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      # Deterministic, before the install: whatever merges cleanly (main's lockfile, when the
      # branch didn't change it, as the factory's never do: ADR-0050) is in place when pnpm
      # installs, and the agent is left with only the conflicts. Nothing is committed yet.
      - name: Start the merge
        if: steps.current.outputs.stale != 'true'
        run: |
          git -c user.name=factory -c user.email=factory@invalid merge --no-ff --no-commit "$MAIN" || true
          git status --short
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.current.outputs.stale != 'true'
      # No dependency cache here (ADR-0030): this job's caches are saved under main, and what it
      # installs comes from a branch, so a cache it saved could reach CI and deploy on main.
      - uses: actions/setup-node@v7
        if: steps.current.outputs.stale != 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # A conflicted lockfile fails here; the agent then hands the pull request to a human.
      - run: pnpm install --frozen-lockfile
        if: steps.current.outputs.stale != 'true'
        continue-on-error: true

      - name: Resolve
        if: steps.current.outputs.stale != 'true'
        id: claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1' # ADR-0029, as in the Factory workflow
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The sweeper starts this through workflow_dispatch with the job's own token, and main's
          # CI can be started by the Claude App's push; select already decided which pull requests.
          allowed_bots: github-actions[bot],claude[bot]
          prompt: |
            Pull request #${{ env.PR }} (branch ${{ env.BRANCH }}, commit ${{ env.SHA }}) conflicts with main.
            The branch is checked out with main (commit ${{ env.MAIN }}) merged into it but not committed:
            `git status` shows what conflicts.
            Follow "Resolving a conflict with main" in your instructions and return the structured output.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 100
            --permission-mode acceptEdits
            --append-system-prompt-file ${{ runner.temp }}/implementer.md
            --allowedTools "Edit,Write,MultiEdit,Bash(cd:*),Bash(pnpm check),Bash(pnpm check:effect),Bash(pnpm check:deps),Bash(pnpm check:adrs),Bash(pnpm check:boundaries),Bash(pnpm prettier:*),Bash(pnpm format:*),Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm typecheck),Bash(pnpm test:*),Bash(pnpm --filter @roundtable/web test:*),Bash(pnpm --filter @roundtable/api test:*),Bash(pnpm vitest:*),Bash(pnpm db:generate:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git commit:*),Bash(git merge --abort),Bash(git push),Bash(git push origin:*),Bash(ls:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(pnpm exec:*),Bash(pnpm dlx:*),Bash(pnpx:*),Bash(npx:*),Bash(git config:*),Bash(git remote:*),Bash(git -c:*),Bash(git --config-env:*),Bash(git --config-env=*),Bash(git credential:*),Read(./.git/**),Grep(./.git/**),Glob(./.git/**),Edit(./.git/**),Write(./.git/**),Edit(./.github/**),Write(./.github/**),Edit(./.claude/**),Write(./.claude/**),Edit(./CLAUDE.md),Write(./CLAUDE.md)"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["resolved","needs-human"]},"summary":{"type":"string"}},"required":["outcome","summary"],"additionalProperties":false}'

      - name: Explain a failed run
        id: failure
        if: always() && steps.claude.outcome == 'failure' && steps.current.outputs.stale != 'true'
        run: '"$RUNNER_TEMP/explain-failure.sh" resolver'

      # Lists what the agent was refused, and flags the run for a human if it reached for
      # credentials or the factory's own rules (ADR-0029).
      - name: Report denied tool calls
        id: denials
        if: always() && steps.current.outputs.stale != 'true'
        run: '"$RUNNER_TEMP/report-denials.sh"'
      - name: Flag a suspicious run
        if: always() && steps.denials.outputs.suspicious == 'true' && steps.current.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ env.PR }}
        run: '"$RUNNER_TEMP/flag-suspicious.sh"'

      # Deterministic: what the agent pushed, whatever it reported, and one marked comment naming
      # main's commit per attempt (select-conflicts.sh counts them). Runs even when the agent
      # failed, so a crash counts: the first is retried by the next run, the second goes to a human.
      # From main, like the guards: pinned by test-report-conflict-attempt.sh.
      - name: Check and report the attempt
        if: always() && steps.current.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.claude.outputs.structured_output || steps.failure.outputs.result }}
          REASON: ${{ steps.failure.outputs.reason }}
        run: '"$RUNNER_TEMP/report-conflict-attempt.sh"'
